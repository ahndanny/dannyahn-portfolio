<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olivia's Activity Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #fdf3e7;
    --bg2: #f3e8ff;
    --ink: #3d2b56;
    --accent: #e05d8c;
    --accent2: #9a6bfb;
    --gold: #f7b32b;
    --card: #fffdf8;
    --shadow: 0 10px 30px rgba(61,43,86,.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height:100%; }
  body {
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background: radial-gradient(1200px 800px at 15% -10%, var(--bg2), transparent 60%),
                radial-gradient(1000px 700px at 110% 110%, #ffe9d1, transparent 55%),
                var(--bg1);
    display:flex; flex-direction:column; align-items:center;
    padding: 28px 16px 60px;
    overflow-x:hidden;
  }
  h1, h2, .big { font-family:'Baloo 2',sans-serif; }
  h1 { font-size:clamp(30px,6vw,46px); font-weight:800; letter-spacing:.01em; text-align:center; }
  h1 .j { color:var(--accent); }
  .sub { color:#7a6a94; text-align:center; margin-top:6px; font-size:15px; }

  .layout {
    display:flex; flex-wrap:wrap; gap:34px; justify-content:center; align-items:flex-start;
    width:100%; max-width:1060px; margin-top:34px;
  }
  .panel {
    background:var(--card); border-radius:22px; box-shadow:var(--shadow);
    padding:24px; width:100%;
  }
  .left { flex:1 1 420px; max-width:480px; }
  .right { flex:1 1 400px; max-width:520px; display:flex; flex-direction:column; gap:22px; }

  /* ---------- jar panel ---------- */
  .stage { position:relative; display:flex; flex-direction:column; align-items:center; }
  #jar-wrap { position:relative; width:min(340px,86vw); }
  #jar-svg { width:100%; display:block; }

  /* papers inside the jar (real DOM slips positioned over the svg) */
  #slips { position:absolute; inset:0; pointer-events:none; }
  .slip {
    position:absolute; min-width:34px; max-width:88px; height:13px; border-radius:3px;
    font-size:7.5px; line-height:13px; text-align:center; color:#5b4322;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 3px;
    display:flex; align-items:center; justify-content:center; gap:3px;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition: top .55s cubic-bezier(.34,1.3,.64,1), left .55s ease, transform .55s ease, opacity .3s;
  }
  .slip .num {
    flex:none; width:10px; height:10px; border-radius:50%; background:rgba(61,43,86,.85);
    color:#fff; font-size:6.5px; font-weight:700; line-height:10px; text-align:center; font-family:'Baloo 2',sans-serif;
  }
  .slip.falling { animation:none; }
  .slip.drawn { opacity:0; transform:scale(1.3) rotate(20deg); }

  /* dice */
  #dice-zone { margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  #dice {
    width:96px; height:96px; cursor:pointer; user-select:none; display:block;
    filter: drop-shadow(0 10px 16px rgba(61,43,86,.3));
  }
  #dice.rolling { animation:shake .45s ease infinite; }
  @keyframes shake {
    0%,100% { transform:rotate(0deg); }
    25% { transform:rotate(-14deg) translateY(-6px); }
    75% { transform:rotate(14deg); }
  }
  #dice-num { font-family:'Baloo 2',sans-serif; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:central; }
  #roll-btn {
    font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:700; letter-spacing:.03em;
    color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; border-radius:999px; padding:13px 40px; cursor:pointer;
    box-shadow:0 8px 20px rgba(224,93,140,.4); transition:transform .15s ease, box-shadow .15s ease;
  }
  #roll-btn:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(224,93,140,.5); }
  #roll-btn:active { transform:translateY(1px); }
  #roll-btn:disabled { opacity:.55; cursor:default; transform:none; }

  /* result banner */
  #result {
    margin-top:22px; min-height:96px; width:min(440px,94vw);
    background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:18px 20px; border:3px dashed transparent;
  }
  #result.show { border-color:var(--gold); animation:pop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0%{transform:scale(.85)} 100%{transform:scale(1)} }
  #result .big { font-size:clamp(22px,5vw,32px); font-weight:800; color:var(--accent); }
  #result .tick { font-size:14px; color:#7a6a94; margin-top:4px; }

  /* ---------- activity manager ---------- */
  .add-row { display:flex; gap:10px; margin-bottom:16px; }
  #new-act {
    flex:1; font-family:'Nunito',sans-serif; font-size:16px; font-weight:600;
    padding:12px 16px; border-radius:12px; border:2px solid #e5dcf2; background:#faf7ff;
    color:var(--ink); outline:none; min-width:0;
  }
  #new-act:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(154,107,251,.15); }
  #add-btn {
    font-family:'Baloo 2',sans-serif; font-size:17px; font-weight:700;
    background:var(--accent2); color:#fff; border:none; border-radius:12px;
    padding:0 20px; cursor:pointer; transition:filter .15s;
  }
  #add-btn:hover { filter:brightness(1.1); }

  #acts { list-style:none; display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto; padding-right:4px; }
  #acts li {
    display:flex; align-items:center; gap:10px;
    background:#faf7ff; border:2px solid #eee6f9; border-radius:14px;
    padding:10px 14px; font-size:15.5px; font-weight:600;
  }
  #acts li .swatch { width:14px; height:14px; border-radius:4px; flex:none; }
  #acts li .name { flex:1; word-break:break-word; }
  #acts li .rm {
    flex:none; width:28px; height:28px; border-radius:8px; border:none; cursor:pointer;
    background:#f3e4ee; color:#b23a67; font-size:16px; font-weight:700; line-height:1;
  }
  #acts li .rm:hover { background:#e8cfe0; }
  .empty-note { text-align:center; color:#a094b8; font-size:14px; padding:14px 0; font-style:italic; }
  #count-badge { font-size:13px; color:#7a6a94; margin-top:12px; text-align:right; }

  .confetti { position:fixed; width:10px; height:10px; top:-14px; z-index:60; pointer-events:none;
    animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

  footer { margin-top:40px; font-size:13px; color:#a094b8; text-align:center; }
  @media (max-width:900px){ .left{order:2} .right{order:1; width:100%; max-width:480px;} }
</style>
</head>
<body>

<h1><span class="j">Olivia's</span> Activity Jar</h1>
<p class="sub">Add activities, roll the dice, and let the jar decide.</p>

<div class="layout">

  <!-- LEFT: jar + dice -->
  <div class="panel left">
    <div class="stage">
      <div id="jar-wrap">
        <svg id="jar-svg" viewBox="0 0 300 340">
          <defs>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#dff3f7" stop-opacity=".75"/>
              <stop offset=".5" stop-color="#cfeaf3" stop-opacity=".55"/>
              <stop offset="1" stop-color="#e8f7fb" stop-opacity=".7"/>
            </linearGradient>
          </defs>
          <!-- lid knob -->
          <ellipse cx="150" cy="30" rx="26" ry="12" fill="#c98a3d"/>
          <ellipse cx="150" cy="26" rx="26" ry="10" fill="#e9a955"/>
          <!-- lid rim -->
          <rect x="78" y="42" width="144" height="26" rx="10" fill="#d99a45"/>
          <rect x="78" y="42" width="144" height="13" rx="6" fill="#eeb264"/>
          <!-- jar body -->
          <path d="M70 72 Q60 80 58 100 L58 288 Q58 318 90 322 L210 322 Q242 318 242 288 L242 100 Q240 80 230 72 Z"
                fill="url(#glass)" stroke="#a9d6e2" stroke-width="3"/>
          <!-- glass highlight -->
          <path d="M84 90 Q78 100 77 120 L77 270" stroke="rgba(255,255,255,.8)" stroke-width="7" stroke-linecap="round" fill="none"/>
        </svg>
        <div id="slips"></div>
      </div>

      <div id="dice-zone">
        <svg id="dice" viewBox="0 0 100 100" title="Click to roll!" role="img" aria-label="dice">
          <defs>
            <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#b78cfb"/>
              <stop offset=".55" stop-color="#9a6bfb"/>
              <stop offset="1" stop-color="#7a4ce0"/>
            </linearGradient>
          </defs>
          <polygon id="dice-shape" points=""/>
          <polygon id="dice-facets" points="" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>
          <polygon id="dice-face" points="" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.5)" stroke-width="1.4"/>
          <text id="dice-num" x="50" y="52">d6</text>
        </svg>
        <button id="roll-btn">Roll the Dice!</button>
      </div>

      <div id="result"><span class="sub" style="margin:0">Your activity will appear here…</span></div>
    </div>
  </div>

  <!-- RIGHT: manager -->
  <div class="panel right">
    <h2 style="font-size:24px; margin-bottom:14px;">Manage Activities</h2>
    <div class="add-row">
      <input id="new-act" type="text" maxlength="40" placeholder="Type an activity…" autocomplete="off" />
      <button id="add-btn">Add</button>
    </div>
    <ul id="acts"></ul>
    <div class="empty-note" id="empty-note" style="display:none;">The jar is empty — add an activity above!</div>
    <div id="count-badge"></div>
  </div>

</div>

<footer>Built with love for Olivia ♥ — your choices are saved on this device.</footer>

<script>
(function(){
  const KEY = 'olivias-activity-jar-v1';
  const PALETTE = ['#ffd166','#ef7fa3','#7fc8f8','#9ad99c','#c9a4f7','#f8b26a','#f78f8f','#8fe3d1'];

  const DEFAULTS = ['Movie night','Board games','Go for a walk','Arts & crafts','Bake cookies',
                    'Dance party','Read a book','Video games','Puzzle time','Picnic'];

  let acts = load();

  const $ = id => document.getElementById(id);
  const listEl = $('acts'), slipsEl = $('slips'), emptyNote = $('empty-note'),
        badge = $('count-badge'), dice = $('dice'), diceShape = $('dice-shape'),
        diceFacets = $('dice-facets'), diceFace = $('dice-face'), diceNum = $('dice-num'),
        rollBtn = $('roll-btn'), input = $('new-act'), addBtn = $('add-btn'),
        result = $('result');

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw === null) return DEFAULTS.slice();
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return DEFAULTS.slice(); }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(acts)); }

  function colorFor(i){ return PALETTE[i % PALETTE.length]; }

  /* ---------- jar slip layout (deterministic pile so it doesn't jump around) ---------- */
  const VBW = 300, VBH = 340; // matches #jar-svg viewBox
  const JAR = { top:100, bottom:304, left:74, right:226 }; // pile region in viewBox px
  function pileSpot(i, n){
    // simple pseudo-random scatter seeded by index; rows fill bottom-up
    const seed = (i * 2654435761) % 4294967296;
    const rows = Math.min(7, Math.max(1, Math.ceil(n / 3)));
    const row = i % rows;
    const yFrac = 0.92 - (row / rows) * 0.75;           // bottom -> up
    const xFrac = 0.18 + ((seed % 1000) / 1000) * 0.62; // scatter horizontally
    const rot = ((seed >> 8) % 40) - 20;
    const x = JAR.left + xFrac * (JAR.right - JAR.left);
    const y = JAR.top + yFrac * (JAR.bottom - JAR.top);
    return { topPct: (y/VBH*100).toFixed(1), leftPct: (x/VBW*100).toFixed(1), rot };
  }

  /* ---------- render ---------- */
  let slipEls = {};   // name -> element
  function render(fast){
    listEl.innerHTML = '';
    acts.forEach((name, i) => {
      const li = document.createElement('li');
      const sw = document.createElement('span'); sw.className='swatch'; sw.style.background=colorFor(i);
      const nm = document.createElement('span'); nm.className='name'; nm.textContent=(i+1) + '. ' + name;
      const rm = document.createElement('button'); rm.className='rm'; rm.textContent='✕'; rm.title='Remove';
      rm.onclick = () => removeAct(i);
      li.append(sw,nm,rm); listEl.appendChild(li);
    });
    emptyNote.style.display = acts.length ? 'none' : 'block';
    badge.textContent = acts.length + ' activit' + (acts.length===1?'y':'ies') + ' in the jar';
    rollBtn.disabled = acts.length < 2;
    updateDiceShape();

    // reconcile slips
    const seen = new Set();
    acts.forEach((name,i)=>{
      let el = slipEls[name];
      if(!el){
        el = document.createElement('div'); el.className='slip';
        el.style.background = colorFor(i);
        const num = document.createElement('span'); num.className='num';
        const lbl = document.createElement('span'); lbl.textContent=name;
        el.append(num, lbl);
        el.dataset.num = String(i+1);
        const s0 = pileSpot(i, acts.length);
        el.style.left = s0.leftPct+'%'; el.style.top = '6%'; el.style.opacity='0';
        el.style.transform = 'translate(-50%,-50%) rotate(' + s0.rot + 'deg)';
        slipsEl.appendChild(el); slipEls[name]=el;
        num.textContent = String(i+1);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          el.style.opacity='1'; el.style.top=s0.topPct+'%';
        }));
      } else {
        const s = pileSpot(i, acts.length);
        el.style.left=s.leftPct+'%'; el.style.top=s.topPct+'%';
        el.style.transform='translate(-50%,-50%) rotate('+s.rot+'deg)';
        el.style.background=colorFor(i);
        const nEl = el.querySelector('.num'); if(nEl) nEl.textContent = String(i+1);
      }
      seen.add(name);
    });
    Object.keys(slipEls).forEach(name=>{
      if(!seen.has(name)){ slipEls[name].remove(); delete slipEls[name]; }
    });
  }

  function addAct(){
    const name = input.value.trim();
    if(!name) return;
    if(acts.some(a=>a.toLowerCase()===name.toLowerCase())){ input.value=''; return; }
    acts.push(name); save(); render(); input.value=''; input.focus();
  }
  function removeAct(i){
    const name = acts[i];
    const el = slipEls[name];
    if(el){ el.classList.add('drawn'); setTimeout(()=>{el.remove(); delete slipEls[name];}, 350); }
    acts.splice(i,1); save(); render();
  }

  /* ---------- multi-face dice: polygon gem, sides = number of activities (min 6) ---------- */
  function polyPoints(n, cx, cy, r){
    const pts = [];
    const off = -Math.PI/2; // point up
    for(let i=0;i<n;i++){
      const a = off + i * 2*Math.PI/n;
      pts.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }
  let diceFaces = 6;
  function updateDiceShape(){
    diceFaces = Math.max(6, acts.length);
    diceShape.setAttribute('points', polyPoints(diceFaces, 50, 52, 44));
    diceShape.setAttribute('fill', 'url(#dg)');
    // inner facet ring for gem look
    diceFacets.setAttribute('points', polyPoints(diceFaces, 50, 52, 33));
    diceFace.setAttribute('points', polyPoints(diceFaces, 50, 52, 21));
    diceNum.textContent = 'd' + diceFaces;
    diceNum.setAttribute('font-size', String(diceFaces > 14 ? 15 : 17));
  }

  let rolling=false;
  async function roll(){
    if(rolling || acts.length<2) return;
    rolling=true; rollBtn.disabled=true; dice.classList.add('rolling');
    result.classList.remove('show'); result.innerHTML='<span class="sub" style="margin:0">Rolling…</span>';

    const DUR=1400; const t0=performance.now();
    await new Promise(res=>{
      (function tick(){
        diceNum.textContent = 'd' + (1+Math.floor(Math.random()*diceFaces));
        if(performance.now()-t0 < DUR) setTimeout(tick, 90);
        else res();
      })();
    });
    dice.classList.remove('rolling');

    const pickIdx = Math.floor(Math.random()*acts.length);
    const pick = acts[pickIdx];
    diceNum.textContent = 'd' + (pickIdx+1);
    const el = slipEls[pick];
    if(el){ el.classList.add('drawn'); setTimeout(()=>{ el.classList.remove('drawn'); }, 2600); }
    await new Promise(r=>setTimeout(r,300));

    result.innerHTML = '<div><div class="big">' + esc(pick) + '</div><div class="tick">🎲 that\'s your activity — have fun!</div></div>';
    result.classList.add('show');
    confetti();
    rollBtn.disabled=false; rolling=false;
  }

  function confetti(){
    const cols = PALETTE;
    for(let i=0;i<40;i++){
      const c=document.createElement('div'); c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=cols[Math.floor(Math.random()*cols.length)];
      c.style.borderRadius=Math.random()<.5?'50%':'2px';
      c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
      c.style.animationDelay=(Math.random()*.4)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3600);
    }
  }
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  /* ---------- events ---------- */
  addBtn.onclick = addAct;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') addAct(); });
  dice.onclick = roll;
  rollBtn.onclick = roll;

  render();
})();
</script>
</body>
</html>
