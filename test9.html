  #title.show { opacity:1; }
  #title h1 { color:#e8f4ff; font-size:min(9vw,86px); font-weight:800; letter-spacing:.3em; text-shadow:0 0 34px rgba(0,240,255,.6),0 0 80px rgba(255,31,85,.3),0 2px 12px rgba(0,0,0,.9); }

  #hint span { display:inline-block; background:rgba(4,5,11,.8); border:1px solid rgba(0,240,255,.18); border-radius:4px; padding:8px 18px; color:rgba(205,225,245,.85); font-size:13px; letter-spacing:.12em; }
  #hint.show { opacity:1; }
  #hud { position:fixed; top:7vh; left:14px; z-index:35; color:#cfe0f2; transition:opacity .6s ease;
    background:rgba(4,5,11,.86); border:1px solid rgba(0,240,255,.16); border-radius:4px; padding:.6rem .85rem; backdrop-filter:blur(4px); box-shadow:0 4px 24px rgba(0,0,0,.5); }
  #hud.faded { opacity:.3; }

  #hud .site em { color:#ff1f55; font-style:normal; }

  #fps { position:fixed; top:7vh; right:14px; z-index:35; color:rgba(160,190,220,.55); font:11px monospace; background:rgba(4,5,11,.6); border:1px solid rgba(0,240,255,.1); border-radius:4px; padding:5px 9px; }
  #toast { position:fixed; bottom:9vh; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(4,5,11,.86); border:1px solid rgba(0,240,255,.4); color:#d9f6ff; padding:10px 26px; font-size:14px; letter-spacing:.12em; border-radius:3px; opacity:0; transition:opacity .5s ease, transform .5s ease; z-index:45; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #btns { position:fixed; bottom:7.5vh; right:14px; z-index:35; display:flex; gap:8px; }
  #btns button { background:rgba(4,5,11,.66); border:1px solid rgba(0,240,255,.35); color:#cfeefc; padding:7px 13px; font:12px "Segoe UI",system-ui,sans-serif; letter-spacing:.1em; cursor:pointer; border-radius:3px; }
  #btns button:hover { background:rgba(0,240,255,.16); border-color:rgba(0,240,255,.7); }
</style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[(Math.random()*arr.length)|0];

// ---------- renderer / scene ----------
const app = $('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DUSK_SKY = new THREE.Color(0x2b1740), NIGHT_SKY = new THREE.Color(0x05060d);
scene.background = NIGHT_SKY.clone();
scene.fog = new THREE.Fog(scene.background.clone(), 110, 400);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 10; controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI*0.492;
controls.target.set(0, 6.5, 0);
controls.enabled = false;

// lights
const hemi = new THREE.HemisphereLight(0x46608e, 0x141a2c, 0.85); scene.add(hemi);
const key = new THREE.DirectionalLight(0xbfd6ff, 1.4); key.position.set(45, 62, 32); scene.add(key);
const mag = new THREE.DirectionalLight(0xff5f8a, 0.5); mag.position.set(-46, 30, -40); scene.add(mag);
const hero = new THREE.DirectionalLight(0x8fc4ff, 1.5); hero.position.set(18, 38, 60); hero.target.position.set(0, 10, 0); scene.add(hero, hero.target);

// ---------- static voxel registry ----------
const reg = new Map();
function addV(x,y,z,w,h,d,color){
  const key = Math.round(color);
  let b = reg.get(key);
  if(!b){ b = {p:[],s:[]}; reg.set(key,b); }
  b.p.push([x,y,z]); b.s.push([w,h,d]);
}
function addBox(x0,x1,y0,y1,z0,z1,color){
  addV((x0+x1)/2,(y0+y1)/2,(z0+z1)/2, x1-x0, y1-y0, z1-z0, color);
}
function jitterBox(x0,x1,y0,y1,z0,z1,p,color){
  x0 += rand(-p,p); x1 -= rand(-p,p); y0 += rand(-p,p); y1 -= rand(-p,p); z0 += rand(-p,p); z1 -= rand(-p,p);
  if(x1<=x0||y1<=y0||z1<=z0) return;
  addBox(x0,x1,y0,y1,z0,z1,color);
}

// palettes — obsidian garden, neon veins
const GROUND=[0x242c48,0x1f2742,0x283252,0x222a46], STONE=[0x40486a,0x373e58,0x474f75],
      ROCK=[0x262c42,0x20263a], TRUNK=[0x241e3a,0x2c2545],
      WALL=[0x222842,0x1d2338], ROOF=[0x161b30,0x1a2038], STEEL=[0x39406a,0x414a78],
      SAND=[0x2a2d3d,0x252836], DARK=[0x07080f];
const CY=0x00f0ff, MG=0xff1f55, AM=0xffb340, PU=0xb07aff, WL=0x9ff7ff, PK=0xff6fb0;

// ---------- terrain ----------
for(let gx=-64; gx<64; gx+=16) for(let gz=-64; gz<64; gz+=16)
  addBox(gx,gx+16,-1,0, gz,gz+16, pick(GROUND));
// glowing circuit cracks in the ground
for(let i=0;i<46;i++){  const x=rand(-60,60), z=rand(-60,60);
  if(x*x+z*z<230) continue;
  if((x-14)*(x-14)+(z-8)*(z-8)<320) continue;
  const c = Math.random()<0.6 ? CY : (Math.random()<0.5 ? MG : PU);
  const len = rand(1.4,4.2);
  if(Math.random()<0.5) addV(x, 0.035, z, len, 0.05, 0.10, c);
  else                  addV(x, 0.035, z, 0.10, 0.05, len, c);
}
// plaza glow ring + studs around the pagoda clearing
for(let k=0;k<44;k++){ const a=k/44*Math.PI*2, rr=12.6;
  addV(Math.cos(a)*rr, 0.06, Math.sin(a)*rr, 0.6,0.06,0.6, (k%11===0)?MG:0x2b6a7c); }
for(let k=0;k<16;k++){ const a=k/16*Math.PI*2+0.2, rr=10.8;
  addV(Math.cos(a)*rr, 0.22, Math.sin(a)*rr, 0.3,0.42,0.3, (k%4===0)?MG:CY); }
// scatter ground rubble
for(let i=0;i<220;i++){
  const x=rand(-62,62), z=rand(-62,62);
  if(x*x+z*z<210) continue;
  if((x-14)*(x-14)+(z-8)*(z-8)<300) continue;
  jitterBox(x,x+rand(.3,.8),0,rand(.18,.38),z,z+rand(.3,.8),0.25,pick(ROCK));
}

// ---------- pagoda ----------
addBox(-7.5,7.5,0,0.9,-7.5,7.5, pick(STONE));
addBox(-5.75,5.75,0.9,1.6,-5.75,5.75, pick(STONE));
addBox(-4.25,4.25,1.6,2,-4.25,4.25, 0x1d2136);
// entrance (south) + doorway light seam
addBox(-1.1,1.1,2,4.2,3.7,4.05, DARK);
addBox(-1.4,1.4,2,4.5,3.9,4.06, CY);
addV(0, 3.1, 4.0, 1.0, 1.4, 0.06, 0x02222b);
let py = 2;
const FH = [4.2,3.7,3.2,2.7,2.3], WW = [3.4,2.95,2.5,2.05,1.65];
for(let f=0; f<5; f++){
  const w = WW[f];
  addBox(-w-.15,w+.15, py, py+0.3, -w-.15,w+.15, pick(ROOF));
  for(const sx of [-1,1]) for(const sz of [-1,1])
    addBox(sx*w-0.25, sx*w+0.25, py+0.3, py+FH[f], sz*w-0.25, sz*w+0.25, pick(STEEL));
  addBox(-w+.2,w-.2, py+0.3, py+FH[f]-0.35, -w+.2,w-.2, DARK);
  // glowing corner tubes
  for(const sx of [-1,1]) for(const sz of [-1,1])
    addV(sx*(w+0.25), py+FH[f]*0.5+0.15, sz*(w+0.25), 0.12, FH[f]-0.35, 0.12, (sx*sz>0)?CY:MG);
  // walls with lit window bands (N/S)
  for(const az of [-w-0.26, w+0.26]){
    addBox(-w+.5,w-.5, py+0.5, py+FH[f]-0.6, az-0.12,az+0.12, pick(WALL));
    addBox(-w+.7,w-.7, py+FH[f]*0.45, py+FH[f]*0.62, az+(az>0?0.14:-0.14), az+(az>0?0.18:-0.18), (f%2)?CY:WL);
    addBox(-0.55,0.55, py+0.55, py+FH[f]-0.7, az-0.16,az+0.16, pick(STEEL));
  }
  addBox(-w-0.26,-w-0.14, py+0.5, py+FH[f]-0.6, -w+.5,w-.5, pick(WALL));
  addBox( w+0.14, w+0.26, py+0.5, py+FH[f]-0.6, -w+.5,w-.5, pick(WALL));
  // roof + neon eave lines
  const ry = py+FH[f], rw = w+1.9;
  addBox(-rw,rw, ry, ry+0.28, -rw,rw, pick(ROOF));
  addBox(-rw*0.72,rw*0.72, ry+0.28, ry+0.56, -rw*0.72,rw*0.72, pick(ROOF));
  addBox(-1.0,1.0, ry+0.56, ry+0.82, -1.0,1.0, pick(ROOF));
  const eaveC = (f%2===0)?CY:MG;
  addV(0, ry+0.05, rw+0.02, rw*2+0.1, 0.07, 0.10, eaveC);
  addV(0, ry+0.05, -rw-0.02, rw*2+0.1, 0.07, 0.10, eaveC);
  addV(rw+0.02, ry+0.05, 0, 0.10, 0.07, rw*2+0.1, eaveC);
  addV(-rw-0.02, ry+0.05, 0, 0.10, 0.07, rw*2+0.1, eaveC);
  // upturned stepped corners with glow caps
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    addV(sx*(rw+0.55), ry+0.18, sz*(rw+0.55), 0.95,0.3,0.95, pick(ROOF));
    addV(sx*(rw+1.25), ry+0.5, sz*(rw+1.25), 0.75,0.28,0.75, pick(ROOF));
    addV(sx*(rw+0.55), ry+0.40, sz*(rw+0.55), 0.4,0.5,0.4, (f+sx+sz)%2?CY:MG);
  }
  py = ry + 0.82;
}
// antenna spire with broadcast rings
addV(0, py+2.4, 0, 0.5, 5.2, 0.5, pick(STEEL));
for(let i=0;i<3;i++){
  const rr = 1.0-i*0.28, ry = py+1.6+i*1.35;
  for(let k=0;k<12;k++){ const a=k/12*Math.PI*2;
    addV(Math.cos(a)*rr, ry, Math.sin(a)*rr, 0.24,0.12,0.24, i===1?MG:CY); }
}
addV(0, py+5.35, 0, 0.5,0.5,0.5, WL);
for(const sx of [-1,1]) for(const sz of [-1,1]) addV(sx*6.6, 1.45, sz*6.6, 0.7,1.0,0.7, CY);

// ---------- torii gate (holo-framed) ----------
for(const sx of [-1,1]){
  addBox(sx*4.2-0.35, sx*4.2+0.35, 0, 6.1, 33.4,34.1, pick(STEEL));
  addV(sx*4.2, 3.05, 34.16, 0.14, 5.9, 0.12, MG);
  addV(sx*4.2, 3.05, 33.34, 0.14, 5.9, 0.12, MG);
  addBox(sx*4.2-0.55, sx*4.2+0.55, 0, 0.5, 33.2,34.3, pick(STONE));
}
addBox(-5.6,5.6, 6.6,7.05, 33.1,34.4, pick(ROOF));
addV(0, 7.12, 34.46, 11.2, 0.12, 0.12, CY);
addV(0, 6.38, 34.42, 9.8, 0.10, 0.10, MG);
addBox(-6.3,6.3, 6.15,6.6, 33.25,34.25, pick(STEEL));
for(const sx of [-1,1]){ addV(sx*6.6, 6.75, 33.75, 0.55,0.7,1.1, pick(ROOF)); addV(sx*6.9, 7.15, 33.75, 0.4,0.5,0.9, pick(ROOF)); }
addBox(-4.9,4.9, 5.0,5.45, 33.4,34.15, pick(STEEL));
addV(0, 5.22, 34.2, 4.6, 0.09, 0.09, CY);
addBox(-0.65,0.65, 5.5,6.1, 33.45,34.1, pick(WALL));
addV(0, 6.62, 33.75, 0.5,0.8,0.4, AM);

// ---------- path stones (lit edges) ----------
for(let i=0;i<11;i++){ const t=i/10; const cx=-0.55+t*1.1+Math.sin(t*9)*0.5;
  addBox(cx, cx+1.25, 0.02,0.22, 31.4-t*25.4, 32.5-t*25.4, pick(STONE));
  addV(cx+0.62, 0.245, 31.95-t*25.4, 1.3, 0.04, 0.09, (i%3===0)?MG:CY); }
for(let i=0;i<7;i++){ addBox(-0.6+i*0.28, 0.85+i*0.28, 0.02,0.22, -9-i*3.4, -8-i*3.4, pick(STONE));
  addV(0.12+i*0.28, 0.245, -8.5-i*3.4, 1.0, 0.04, 0.09, CY); }

// ---------- holo trees ----------
function makeTrunk(x,z,h,c1,c2){
  for(let i=0;i<h;i++) addBox(x-0.26,x+0.26, i*0.92, (i+1)*0.92, z-0.26,z+0.26, i%2? c1:c2);
}
function makeCanopy(x,z,baseY,cols,clusters,r){
  for(let c=0;c<clusters;c++){
    const cx = x+rand(-r*1.1,r*1.1), cy = baseY+rand(-r*0.5,r*0.7), cz = z+rand(-r*1.1,r*1.1);
    const cr = rand(r*0.7,r*1.15);
    for(let i=0;i<52;i++){
      const a=rand(0,Math.PI*2), b=Math.acos(rand(-1,1)), rr=cr*Math.cbrt(Math.random());
      jitterBox(cx+Math.sin(b)*Math.cos(a)*rr, cx+0.42+Math.sin(b)*Math.cos(a)*rr,
                cy+Math.cos(b)*rr*0.8, cy+0.42+Math.cos(b)*rr*0.8,
                cz+Math.sin(b)*Math.sin(a)*rr, cz+0.42+Math.sin(b)*Math.sin(a)*rr,
                0.16, pick(cols));
    }
  }
}
const treeSpots = {
  holo:[[8,18],[-8,18],[19,-3]], wire:[[-20,6],[-17,-26],[9,-30]], pine:[[-15,11],[16,20],[-6,-36]]
};
for(const [x,z] of treeSpots.holo){ makeTrunk(x,z,5,TRUNK[0],TRUNK[1]); makeCanopy(x,z,4.6, Math.random()<0.5?[PK,0xd14b86,0x9c2f63]:[0x2fb8da,0x1f8fb0,0x12657f],3,3.1); }
for(const [x,z] of treeSpots.wire){ makeTrunk(x,z,4,TRUNK[1],TRUNK[0]); makeCanopy(x,z,3.7,[0x9a63e8,0x6b3fb0,0xd0a4ff],2,2.4); }
for(const [x,z] of treeSpots.pine){
  makeTrunk(x,z,3,TRUNK[1],TRUNK[0]);
  for(let t=0;t<3;t++){ const w=2.6-t*0.7; addBox(x-w,x+w, 2.6+t*1.5, 3.6+t*1.5, z-w,z+w, pick(ROCK)); addBox(x-w*0.6,x+w*0.6, 3.6+t*1.5, 4.3+t*1.5, z-w*0.6,z+w*0.6, pick(ROCK)); }
}
// fiber-optic bamboo
for(let i=0;i<18;i++){
  const x=rand(-31,-25), z=rand(-8,6);
  const h=rand(6,9);
  for(let s=0;s<h;s++) addBox(x-0.14,x+0.14, s*1.1, s*1.1+1.02, z-0.14,z+0.14, s%2?0x1f4a52:0x265963);
  addBox(x-0.5,x+0.5, h*1.1-0.2, h*1.1+0.25, z-0.5,z+0.5, 0x2d6b74);
  addV(x, h*1.1+0.42, z, 0.16,0.3,0.16, CY);
}

// ---------- pond (holo reflector) ----------
const POND = {x:14, z:8, r:9.2};
{
  const segs=40;
  const shape=new THREE.Shape();
  for(let i=0;i<=segs;i++){ const a=i/segs*Math.PI*2, rr=POND.r*(1+0.06*Math.sin(a*3)+0.04*Math.cos(a*2));
    const px=POND.x+Math.cos(a)*rr, pz=POND.z+Math.sin(a)*rr;
    i? shape.lineTo(px,pz) : shape.moveTo(px,pz); }
  const geo=new THREE.ShapeGeometry(shape,48);
  geo.rotateX(-Math.PI/2);
  const water=new Reflector(geo,{ clipBias:0.003, textureWidth:1024, textureHeight:1024, color:0x1a2f3d });
  water.position.y=0.32; scene.add(water);
  for(let i=0;i<46;i++){ const a=i/46*Math.PI*2, rr=POND.r+0.25;
    const x=POND.x+Math.cos(a)*rr, z=POND.z+Math.sin(a)*rr;
    addV(x, 0.12, z, 0.55,0.24,0.55, (i%7===0)?MG:0x14313f); }
  for(let i=0;i<34;i++){ const a=i/34*Math.PI*2, rr=POND.r+1.1;
    const x=POND.x+Math.cos(a)*rr, z=POND.z+Math.sin(a)*rr;
    jitterBox(x-0.55,x+0.55, 0,rand(0.4,0.75), z-0.55,z+0.55, 0.2, pick(STONE)); }
}

// ---------- bridge ----------
{
  const bx=12, bz0=0.6, bz1=15.4, N=15;

}

const _p=new THREE.Vector3(), _t=new THREE.Vector3();
function easeInOut(k){ return k<0.5? 2*k*k : 1-Math.pow(-2*k+2,2)/2; }
function evalIntro(k){
  const u=easeInOut(k)*(KEYS.length-1);
  const i=Math.min(KEYS.length-2, Math.floor(u)), f=u-i;
  _p.set(
    THREE.MathUtils.lerp(KEYS[i].p[0],KEYS[i+1].p[0],f),
    THREE.MathUtils.lerp(KEYS[i].p[1],KEYS[i+1].p[1],f),
    THREE.MathUtils.lerp(KEYS[i].p[2],KEYS[i+1].p[2],f));
  _t.set(
    THREE.MathUtils.lerp(KEYS[i].t[0],KEYS[i+1].t[0],f),
    THREE.MathUtils.lerp(KEYS[i].t[1],KEYS[i+1].t[1],f),
    THREE.MathUtils.lerp(KEYS[i].t[2],KEYS[i+1].t[2],f));
  camera.position.copy(_p); controls.target.copy(_t); camera.lookAt(_t);
}
function startIntro(withTitle){
  intro.active=true; intro.t0=performance.now(); intro.dur=8000; intro.dawn=withTitle;
  controls.enabled=false; document.body.classList.add('playing');
  if(withTitle){
    $('title').classList.remove('show'); $('hint').classList.remove('show');
    setTimeout(()=>$('title').classList.add('show'), 1600);
    setTimeout(()=>$('title').classList.remove('show'), 7200);
  } else {
    setTimeout(()=>{ intro.active=false; controls.enabled=true; document.body.classList.remove('playing'); }, 900);
  }
}
function setIntroDone(){
  if(!intro.active) return;
  intro.active=false; controls.enabled=true; document.body.classList.remove('playing');
  evalIntro(1); $('hint').classList.add('show'); setTimeout(()=>$('hint').classList.remove('show'), 7000);
}

}

// ---------- composer ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.5, 0.45, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- resize ----------
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

// ---------- main loop ----------
let last=performance.now(), frames=0, fpsAcc=0, idle=0;
let nextBolt=rand(6,14);
const axisY=new THREE.Vector3(0,1,0);
controls.addEventListener('start', ()=>{ idle=0; });
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const T=now/1000;

  // mood blend
  if(Math.abs(skyMix-skyTarget)>0.001){ skyMix += (skyTarget-skyMix)*Math.min(1,dt*1.4); }
  applySky(skyMix);

  // surge decay + neon pulse
  surge=Math.max(0, surge - dt*0.22);
  const pulse=1.12 + surge*0.7 + 0.08*Math.sin(T*(1.4+surge*7));
  for(const m of glowMats){ m.color.copy(m.userData.base); m.color.multiplyScalar(pulse); }
  bloom.strength = 0.5 + surge*0.45;
  moonRing.lookAt(camera.position); magHalo.lookAt(camera.position); moonDisc.lookAt(camera.position);

  // lightning flicker
  nextBolt -= dt;
  if(nextBolt <= 0.12 && nextBolt > 0.12-dt){ hemi.intensity += 1.6; }
  if(nextBolt <= 0){ nextBolt = rand(6,16); }

  // searchlights sway
  for(const s of lights3){ s.pivot.rotation.y = Math.sin(T*s.sp + s.ph)*0.9; }

  // intro / orbit
  if(intro.active){
    const k=(now-intro.t0)/intro.dur;
    evalIntro(Math.min(1,k));
    if(k>=1) setIntroDone();
  } else {
    idle+=dt;
    if(idle>9){ camera.position.applyAxisAngle(axisY, 0.00055); }
    controls.update();
  }

  const windS = 0.6 + surge*2.6;

  // data motes
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), sv=new THREE.Vector3(1,1,1), pv=new THREE.Vector3();
  for(let i=0;i<PET;i++){
    const p=petals[i];
    p.y -= p.vy*dt*windS;
    p.x += (Math.sin(T*1.3+p.ph)*0.5 + surge*1.6)*dt*2;
    p.rot += dt*(1.5+surge*4);
    if(p.y<0.15){ const s=pick(srcs); p.x=s[0]+rand(-5,5); p.z=s[1]+rand(-5,5); p.y=rand(8,12.5); }
    q.setFromEuler(new THREE.Euler(p.rot, p.rot*0.7, 0));
    pv.set(p.x,p.y,p.z);
    m4.compose(pv, q, sv);
    petalIM.setMatrixAt(i,m4);
  }
  petalIM.instanceMatrix.needsUpdate=true;

  // rain (follows camera, slight shear)
  rainIM.position.x = camera.position.x; rainIM.position.z = camera.position.z;
  for(let i=0;i<RAIN;i++){
    const d=drops[i];
    d.y -= d.v*dt; d.x += dt*2.2;
    if(d.y < 0){ d.y = rand(36,44); d.x=rand(-55,55); d.z=rand(-55,55); }
    dummy.position.set(d.x, d.y, d.z); dummy.rotation.set(0,0,0.06); dummy.scale.set(1,1,1);
    dummy.updateMatrix(); rainIM.setMatrixAt(i,dummy.matrix);
  }
  rainIM.instanceMatrix.needsUpdate=true;
  // rain splashes in the pond
  if(Math.random() < dt*3.2){
    const a=rand(0,6.28), r=rand(0.5,POND.r-0.8);
    spawnRipple(POND.x+Math.cos(a)*r, POND.z+Math.sin(a)*r);
  }

  // neon koi
  for(let i=0;i<koiData.length;i++){
    const k=koiData[i]; k.a += k.sp*dt;
    const x=POND.x+Math.cos(k.a)*k.r, z=POND.z+Math.sin(k.a)*k.r;
    dummy.position.set(x, 0.42+Math.sin(T*2+i)*0.03, z);
    dummy.rotation.set(0, -k.a + (k.sp>0?Math.PI/2:-Math.PI/2), 0);
    dummy.scale.set(k.len,0.18,0.34);
    dummy.updateMatrix(); koiIM.setMatrixAt(i,dummy.matrix);
    _col.setHex(k.col); koiIM.setColorAt(i,_col);
  }
  koiIM.instanceMatrix.needsUpdate=true; if(koiIM.instanceColor) koiIM.instanceColor.needsUpdate=true;

  // patrol drones
  for(let i=0;i<DR;i++){ const d=drones[i]; d.a += d.sp*dt;
    dummy.position.set(Math.cos(d.a)*d.r, d.h + Math.sin(T*0.8+d.ph)*0.8, Math.sin(d.a)*d.r);
    dummy.rotation.set(0, -d.a, 0); dummy.scale.set(1,1,1);
    dummy.updateMatrix(); drIM.setMatrixAt(i,dummy.matrix);
    const blink = 0.6+0.4*Math.sin(T*5+d.ph*7);
    _col.setRGB(blink, 0.15, 0.2+0.3*blink); drIM.setColorAt(i,_col);
  }
  drIM.instanceMatrix.needsUpdate=true; if(drIM.instanceColor) drIM.instanceColor.needsUpdate=true;

  // bell swing
  if(bellRing>=0){
    bellRing+=dt;
    const ang=Math.exp(-bellRing*0.55)*Math.sin(bellRing*7.5)*0.5;
    bellIM.rotation.z=ang; bellIM.position.set(Math.sin(ang)*0.9, 19.1, -51);
    if(bellRing>6){ bellRing=-1; bellIM.rotation.z=0; bellIM.position.set(0,19.1,-51); }
  }

  // EMP ring
  if(empT<1.4){ empT+=dt;
    const s=0.5+empT*52;
    emp.scale.set(s,1,s);
    emp.material.opacity=Math.max(0,1-empT/1.4)*0.85;
  } else emp.material.opacity=0;

  // lotus bob
  for(const p of pads){ p.pad.position.y=0.37+Math.sin(T*1.2+p.bob)*0.02; if(p.lot) p.lot.position.y=0.55+Math.sin(T*1.2+p.bob)*0.02; }

  // caustic
  caustic.rotation.z = T*0.05; caustic.material.opacity = 0.12*skyMix*(0.75+0.25*Math.sin(T*0.7));

  // ripples
  for(let i=0;i<RIP;i++){ const r=rips[i];
    if(r.t<1){ r.t+=dt*0.55; const s=0.2+r.t*2.3, f=Math.max(0.001,1.3*(1-r.t));
      dummy.position.set(r.x,0.345,r.z); dummy.rotation.set(-Math.PI/2,0,0); dummy.scale.set(s,s,s);
      dummy.updateMatrix(); ripIM.setMatrixAt(i,dummy.matrix);
      _col.setRGB(f, f, Math.min(1,f*1.4)); ripIM.setColorAt(i,_col);
    } else { dummy.position.set(0,-50,0); dummy.scale.set(0.0001,0.0001,0.0001); dummy.rotation.set(0,0,0); dummy.updateMatrix(); ripIM.setMatrixAt(i,dummy.matrix); }
  }
  ripIM.instanceMatrix.needsUpdate=true; if(ripIM.instanceColor) ripIM.instanceColor.needsUpdate=true;

  // fps
  frames++; fpsAcc+=dt;
  if(fpsAcc>=0.5){ $('fps').textContent=Math.round(frames/fpsAcc)+' fps  |  '+totalVoxels.toLocaleString()+' voxels'; frames=0; fpsAcc=0; }

  composer.render();
}
requestAnimationFrame(animate);
</script>
</body>
</html>
