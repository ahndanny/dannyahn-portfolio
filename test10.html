<style>

  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none}

  .tag.tr{top:22px;right:58px;text-align:right;color:var(--mg);text-shadow:0 0 12px rgba(255,43,122,.5)}
  .tag.bl{bottom:22px;left:58px}
  .tag.br{bottom:22px;right:58px;text-align:right}

  .blink{animation:blink 1.4s steps(2,start) infinite}

  .hintbar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;color:rgba(207,214,228,.6);white-space:nowrap;text-transform:uppercase;background:rgba(4,3,10,.78);padding:.5em 1.2em}

  #audioBtn{position:absolute;top:52px;right:58px;pointer-events:auto;background:rgba(4,3,10,.78);border:1px solid rgba(255,43,122,.5);color:var(--mg);font:inherit;font-size:10px;letter-spacing:.25em;padding:.45em 1em;cursor:pointer;text-transform:uppercase;transition:all .2s}

<script>
(function(){
"use strict";
var canvas = document.getElementById("gl");
var gl = canvas.getContext("webgl", {antialias:false, alpha:false, depth:false, stencil:false,
  powerPreference:"high-performance", preserveDrawingBuffer:true})
  || canvas.getContext("experimental-webgl");
if(!gl){ document.getElementById("boot").innerHTML = "<div style='color:#ff2b7a;letter-spacing:.2em'>GPU CONTEXT REFUSED - THIS CITY NEEDS WEBGL.</div>"; return; }

var QUAD_VS =
"attribute vec2 aPos;\n"
+"varying vec2 vUv;\n"
+"void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }\n";

var SCENE_FS = ""
+"precision highp float;\n"
+"uniform vec2 uRes; uniform float uTime; uniform float uYaw; uniform float uPitch;\n"
+"uniform float uZ; uniform float uSway; uniform float uEmp;\n"
+"#define CELL 14.0\n"
+"#define FAR 240.0\n"
+"#define STEPS 88\n"
+"float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }\n"
+"float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }\n"
+"float hash21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }\n"
+"mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }\n"
+"float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\n"
+"float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<3;i++){ v+=a*hash12(p); p=p*2.07+1.3; a*=0.5;} return v; }\n"
+"float waveH(vec2 xz){\n"
+"  float t = uTime*0.9;\n"
+"  vec2 p = xz*0.17;\n"
+"  float h = 0.42*sin(p.x*1.7 + t*1.15)\n"
+"          + 0.34*sin(p.y*2.1 - t*0.85)\n"
+"          + 0.26*sin(dot(p,vec2(0.9,1.3))*1.4 + t*1.7)\n"
+"          + 0.18*sin(dot(p,vec2(-1.25,0.75))*1.9 - t*1.35)\n"
+"          + 0.10*sin(dot(p,vec2(2.3,-1.9))*2.6 + t*2.3)\n"
+"          + 0.07*sin(dot(p,vec2(-3.1,2.7))*4.2 - t*3.1);\n"
+"  return h*0.55 - 0.18;\n"
+"}\n"
+"vec2 ripples(vec2 p){ float e=0.30; float a=fbm(p*1.7 + uTime*vec2(0.25,0.18));\n"
+"  return vec2(fbm((p+vec2(e,0.0))*1.7 + uTime*vec2(0.25,0.18))-a, fbm((p+vec2(0.0,e))*1.7 + uTime*vec2(0.25,0.18))-a)/e*0.045; }\n"
+"void cellInfo(vec2 id, out float bh, out float wx, out float wz, out float ph, out vec2 off, out float seed){\n"
+"  float a = hash12(id+1.7), b = hash12(id+5.3), r = hash12(id+9.7);\n"
+"  float w1 = 3.2 + 1.9*a, w2 = w1*(0.55+0.5*b);\n"
+"  wx = mix(w1,w2,r); wz = mix(w2,w1,r);\n"
+"  bh = 14.0 + 86.0*pow(hash12(id+2.3), 2.0);\n"
+"  ph = 3.5 + 7.5*hash12(id+11.9);\n"
+"  float mo = 7.0 - max(wx,wz) - 1.7;\n"
+"  off = (vec2(hash12(id+3.1), hash12(id+4.7)) - 0.5) * 2.0 * max(mo,0.0);\n"
+"  seed = hash12(id+5.9);\n"
+"}\n"
+"vec3 neonHue(vec2 id){ float k=hash12(id+17.3);\n"
+"  return k<0.30 ? vec3(1.0,0.15,0.42) : k<0.55 ? vec3(0.20,0.78,1.0) : k<0.72 ? vec3(1.0,0.55,0.15) : k<0.87 ? vec3(0.62,0.28,1.0) : vec3(0.25,1.0,0.68); }\n"
+"float mapB(vec3 p, out vec2 oId, out float oBh, out float oSeed){\n"
+"  vec2 id = floor(p.xz/CELL);\n"
+"  float bh,wx,wz,ph,seed; vec2 off; cellInfo(id,bh,wx,wz,ph,off,seed);\n"
+"  vec2 ctr = id*CELL + CELL*0.5 + off;\n"
+"  vec3 q = vec3(p.x-ctr.x, p.y, p.z-ctr.y);\n"
+"  float d = sdBox(q - vec3(0.0,bh*0.5,0.0), vec3(wx, bh*0.5+0.5, wz));\n"
+"  if(hash12(id+23.7) > 0.45){\n"
+"    float ch = ph*0.5;\n"
+"    d = min(d, sdBox(q - vec3(0.0, bh+ch, 0.0), vec3(wx*0.62, ch, wz*0.62)));\n"
+"  }\n"
+"  float pod = 3.0+2.5*hash12(id+29.3);\n"
+"  d = min(d, sdBox(q - vec3(0.0, pod*0.5, 0.0), vec3(min(wx+1.6,6.4), pod*0.5, min(wz+1.6,6.4))));\n"
+"  if(bh > 66.0) d = min(d, sdBox(q - vec3(0.0, bh+ph*0.5+5.0, 0.0), vec3(0.12,5.0,0.12)));\n"
+"  oId=id; oBh=bh; oSeed=seed; return d;\n"
+"}\n"
+"float map(vec3 p){ vec2 id; float bh,s; float d=mapB(p,id,bh,s); return min(d, p.y - waveH(p.xz)); }\n"
+"float empMul(){ return mix(1.0, 0.10 + 0.90*step(0.55, hash11(floor(uTime*23.0))), uEmp); }\n"
+"float flashVal(){\n"
+"  float gate = hash11(floor(uTime*0.09));\n"
+"  if(gate < 0.86) return 0.0;\n"
+"  float lt = fract(uTime*0.09)*14.3;\n"
+"  return max(0.0, sin(lt*18.0)*exp(-lt*1.2)) * (0.6+0.4*step(0.5, hash11(floor(uTime*3.7))));\n"
+"}\n"
+"vec3 windowsAt(vec2 id, float bh, float seed, float hh, float yy, float empMul){\n"
+"  if(yy<0.6 || yy>bh-0.5) return vec3(0.0);\n"
+"  vec2 cell = vec2(floor(hh/1.7), floor(yy/2.3));\n"
+"  vec2 f = vec2(fract(hh/1.7), fract(yy/2.3));\n"
+"  float pane = step(0.16,f.x)*step(f.x,0.84)*step(0.14,f.y)*step(f.y,0.86);\n"
+"  if(pane<0.5) return vec3(0.0);\n"
+"  float lr = hash12(cell + id*13.7 + seed*31.0);\n"
+"  float bias = 0.46 + 0.34*clamp(yy/max(bh,1.0),0.0,1.0);\n"
+"  if(lr < bias) return vec3(0.0);\n"
+"  float blinkv = (fract(lr*13.7)>0.965) ? (0.55+0.45*step(0.5,fract(uTime*3.0+lr*11.0))) : 1.0;\n"
+"  float cs = hash12(cell+7.31);\n"
+"  vec3 c = cs<0.55 ? mix(vec3(1.0,0.70,0.34), vec3(1.0,0.88,0.60), fract(cs*7.0))\n"
+"         : cs<0.78 ? vec3(0.35,0.85,1.0) : cs<0.92 ? vec3(1.0,0.25,0.55) : vec3(0.62,1.0,0.72);\n"
+"  return c*blinkv*empMul*(0.55+0.65*clamp((hh - floor(hh/1.7)*1.7)/1.7,0.0,1.0));\n"
+"}\n"
+"vec3 billboard(vec3 p, vec2 id, float bh, float seed, vec3 n){\n"
+"  if(seed < 0.62 || bh < 26.0) return vec3(0.0);\n"
+"  float b2,wx2,wz2,ph2,s2; vec2 coff; cellInfo(id,b2,wx2,wz2,ph2,coff,s2);\n"
+"  vec2 ctr = id*CELL + CELL*0.5 + coff;\n"
+"  bool ax = abs(n.x) > 0.5;\n"
+"  float cu = ax ? p.z : p.x;\n"
+"  float cc = ax ? ctr.y : ctr.x;\n"
+"  float hw = min(2.1, (ax ? wz2 : wx2)*0.85);\n"
+"  float u = (cu - cc)/hw;\n"
+"  if(abs(u) > 0.94) return vec3(0.0);\n"
+"  float y0 = 8.0 + bh*0.35 + fract(seed*19.0)*(bh*0.4);\n"
+"  float hh2 = 4.5 + 5.0*fract(seed*29.0);\n"
+"  float v = (p.y - y0)/hh2;\n"
+"  if(v < 0.0 || v > 1.0) return vec3(0.0);\n"
+"  float edge = smoothstep(0.94,0.80,abs(u))*smoothstep(0.0,0.07,v)*smoothstep(1.0,0.93,v);\n"
+"  vec2 sc = vec2(7.0, 13.0);\n"
+"  vec2 gi = vec2(floor(u*sc.x), floor(v*sc.y - uTime*(1.2+2.2*fract(seed*5.0))*sign(sin(seed*8.0))));\n"
+"  float g = hash12(gi + id*17.0 + seed*90.0);\n"
+"  vec3 col = neonHue(id + floor(seed*40.0));\n"
+"  vec3 acc = col * step(0.48, g) * (0.75 + 0.25*sin(uTime*3.0 + g*40.0));\n"
+"  acc += col*0.35*step(0.75, fract(v*9.0 - uTime*0.6));\n"
+"  acc *= edge * (0.85 + 0.15*step(0.985, fract(uTime*9.0 + seed*40.0)));\n"
+"  return acc*empMul()*1.3;\n"
+"}\n"
+"vec3 emisAt(vec3 p){\n"
+"  vec2 id=floor(p.xz/CELL); float bh,wx,wz,ph,seed; vec2 off; cellInfo(id,bh,wx,wz,ph,off,seed);\n"
+"  if(p.y > bh+4.0) return vec3(0.0);\n"
+"  vec2 ctr = id*CELL + CELL*0.5 + off;\n"
+"  vec2 lr2 = abs(p.xz-ctr);\n"
+"  float hh = lr2.x>lr2.y ? p.x : p.z;\n"
+"  vec3 acc = windowsAt(id,bh,seed,hh,p.y,empMul())*0.55;\n"
+"  if(p.y>1.1 && p.y<2.4) acc += neonHue(id)*0.65;\n"
+"  float k=hash12(id+40.1);\n"
+"  if(k>0.75 && p.y>5.5 && p.y<13.5) acc += neonHue(id+3.3)*(0.55+0.45*sin(uTime*17.0+k*90.0))*0.6;\n"
+"  return acc;\n"
+"}\n"
+"vec3 surfEmis(vec3 p, vec3 n){\n"
+"  vec2 id; float bh,seed; mapB(p,id,bh,seed);\n"
+"  float hh = abs(n.x)>0.5 ? p.z : p.x;\n"
+"  vec3 acc = windowsAt(id,bh,seed,hh,p.y,empMul());\n"
+"  float cbh,cwx,cwz,cph,cseed; vec2 coff; cellInfo(id,cbh,cwx,cwz,cph,coff,cseed);\n"
+"  vec2 ctr = id*CELL + CELL*0.5 + coff;\n"
+"  float ex = abs(abs(p.x-ctr.x)-cwx), ez = abs(abs(p.z-ctr.y)-cwz);\n"
+"  float edge = smoothstep(0.16,0.02,max(ex,ez));\n"
+"  if(hash12(id+33.3)>0.62 && p.y>1.0) acc += neonHue(id+11.7)*edge*0.8;\n"
+"  if(n.y>0.7){ float rim = smoothstep(0.5,0.0,min(ex,ez)); acc += neonHue(id+7.1)*rim*0.5; }\n"
+"  acc += billboard(p,id,bh,seed,n);\n"
+"  if(p.y>1.1 && p.y<2.4) acc += neonHue(id)*0.7;\n"
+"  float k=hash12(id+40.1);\n"
+"  if(k>0.75 && p.y>5.5 && p.y<13.5) acc += neonHue(id+3.3)*(0.6+0.4*step(0.35,fract(sin(floor(uTime*15.0))*43758.5453)))*1.8;\n"
+"  if(bh>66.0 && p.y>bh+5.0 && p.y<bh+7.0) acc += vec3(1.0,0.12,0.1)*(0.5+0.5*sin(uTime*3.0+id.x*2.1))*2.0;\n"
+"  return acc;\n"
+"}\n"
+"vec3 carsAt(vec3 p){\n"
+"  vec3 acc = vec3(0.0);\n"
+"  for(int i=0;i<7;i++){\n"
+"    float fi=float(i);\n"
+"    float lane = -9.0 + fi*3.0 + 3.5*hash11(fi*7.1);\n"
+"    float yy = 20.0 + 15.0*fi + hash11(fi*3.3)*6.0;\n"
+"    float sp = (hash11(fi*1.7)>0.5 ? 26.0 : -22.0);\n"
+"    float per = 170.0;\n"
+"    float cz = mod(uZ + uTime*sp + fi*61.0, per);\n"
+"    float dz = p.z - cz;\n"
+"    if(abs(p.x-lane)<7.0 && abs(p.y-yy)<3.0 && dz>-18.0 && dz<3.0){\n"
+"      float d2 = (p.x-lane)*(p.x-lane)+(p.y-yy)*(p.y-yy)+dz*dz*0.02;\n"
+"      vec3 col = sp>0.0 ? vec3(1.0,0.18,0.25) : vec3(0.25,0.85,1.0);\n"
+"      acc += col * (1.0/(1.0+d2*0.9)) * (dz<0.0 ? 0.55 : 1.4);\n"
+"    }\n"
+"  }\n"
+"  return acc;\n"
+"}\n"
+"vec3 skyCol(vec3 rd){\n"
+"  float h = clamp(rd.y*0.5+0.5, 0.0, 1.0);\n"
+"  vec3 c = mix(vec3(0.052,0.030,0.048), vec3(0.004,0.007,0.020), pow(h,0.8));\n"
+"  vec2 ck = rd.xz/(abs(rd.y)+0.15);\n"
+"  float cl = fbm(ck*0.55 + vec2(uTime*0.016,0.0));\n"
+"  float clm = smoothstep(0.42,0.72,cl)*clamp(1.0-abs(rd.y)*1.4,0.0,1.0);\n"
+"  c += mix(vec3(0.10,0.055,0.075), vec3(0.055,0.075,0.125), fract(cl*3.7))*clm*1.5;\n"
+"  c += vec3(0.11,0.055,0.028)*pow(1.0-abs(rd.y),9.0)*1.35;\n"
+"  c += vec3(0.035,0.015,0.06)*pow(1.0-abs(rd.y),5.0)*max(0.0,-rd.z)*0.8;\n"
+"  float fl = flashVal();\n"
+"  c += vec3(0.55,0.60,0.90)*fl*0.65*pow(1.0-abs(rd.y)*0.55,2.0);\n"
+"  if(rd.y>0.15){ vec2 g=floor(rd.xy*160.0); float s=hash21(g);\n"
+"    c += vec3(0.5,0.55,0.7)*step(0.9965,s)*clamp(rd.y,0.0,1.0)*0.5; }\n"
+"  return c;\n"
+"}\n"
+"float trace(vec3 ro, vec3 rd, out vec3 hitP, out vec3 hitN, out float hitMat, out vec3 glow){\n"
+"  float t=0.0; hitMat=-1.0; glow=vec3(0.0);\n"
+"  for(int i=0;i<STEPS;i++){\n"
+"    vec3 p=ro+rd*t; float d=map(p);\n"
+"    glow += emisAt(p)*min(d,2.0)*0.010*exp(-t*0.012);\n"
+"      glow += carsAt(p)*min(d,2.0)*0.006*exp(-t*0.05);\n"
+"      glow = min(glow, vec3(0.55));\n"
+"    if(d<0.0015*t+0.0009){\n"
+"      hitP=p;\n"
+"      vec2 e=vec2(0.0015,0.0);\n"
+"      hitN=normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx)));\n"
+"      vec2 mid; float mbh,msd; hitMat = (mapB(p,mid,mbh,msd) > p.y - waveH(p.xz)) ? 1.0 : 0.0;\n"
+"      return t;\n"
+"    }\n"
+"    t += d*0.94;\n"
+"    if(t>FAR) break;\n"
+"  }\n"
+"  return -1.0;\n"
+"}\n"
+"vec3 traceEmit(vec3 ro, vec3 rd){\n"
+"  vec3 acc=vec3(0.0); float t=0.02;\n"
+"  for(int i=0;i<34;i++){\n"
+"    vec3 p=ro+rd*t; float d=map(p);\n"
+"    if(d<0.02){ acc += surfEmis(p,vec3(0.0,0.0,1.0)); break; }\n"
+"    acc += emisAt(p)*min(d,2.0)*0.010;\n"
+"    t += max(d*1.2, 0.35);\n"
+"    if(t>160.0) break;\n"
+"  }\n"
+"  acc *= exp(-t*0.0075);\n"
+"  return acc;\n"
+"}\n"
+"vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }\n"
+"float rainStreak(vec2 v){ float acc=0.0;\n"
+"  for(int i=0;i<2;i++){\n"
+"    float fi=float(i);\n"
+"    float sc=40.0+fi*58.0;\n"
+"    float cx=floor((v.x+v.y*0.10)*sc);\n"
+"    float s=hash12(vec2(cx,fi*7.31));\n"
+"    if(s>0.87){\n"

  if(fpsT>=1){ fps=Math.round(frames/fpsT); frames=0; fpsT=0; if(fpsEl) fpsEl.textContent=fps; }
  hudT += dt;
  if(hudT>0.4 && coordsEl){
    hudT=0;
    coordsEl.textContent = (Math.abs(zPos)%1000).toFixed(2)+" / "+(Math.sin(t*0.21)*5).toFixed(2);
    if(spdEl) spdEl.textContent = thrust.toFixed(1);
    if(sectorEl && Math.random()<0.12) sectorEl.textContent = 1+Math.floor(Math.random()*23);
    if(wardEl && Math.random()<0.06) wardEl.textContent = wards[Math.floor(Math.random()*wards.length)];
  }
}
resize();
requestAnimationFrame(frame);

  ["&gt; ESTABLISHING NEURAL LINK ............", "&nbsp;<span class='ok'>OK</span>", 260],
  ["&gt; OPTIC CORTEX HANDSHAKE .............", "&nbsp;<span class='ok'>OK</span>", 340],
  ["&gt; LOADING GEOSPACE / NIGHT_CITY_04 ...", "&nbsp;<span class='ok'>OK</span>", 520],
  ["&gt; ATMOSPHERE: ACID RAIN / SMOG 87% ...", "&nbsp;<span class='ok'>OK</span>", 300],
  ["&gt; ICE SWEEP ..........................", "&nbsp;<span class='warn'>3 FLAGS IGNORED</span>", 460],
  ["&gt; BODY HOT. MIND COLD.", "", 300]
];
var bootEl = document.getElementById("bootlines"), bi=0;
function bootStep(){
  if(bi >= bootLines.length){
    bootEl.innerHTML += "<div class='ok' style='margin-top:.6em;letter-spacing:.35em'>&gt; WELCOME TO THE NIGHT CITY<span class='cursor'>&nbsp;</span></div>";
    setTimeout(function(){ document.getElementById("boot").classList.add("gone"); }, 1300);

  }
  var row = bootLines[bi++];
  var div = document.createElement("div");
  div.innerHTML = row[0] + row[1];
  bootEl.appendChild(div);
  setTimeout(bootStep, row[2]);
}
bootStep();
})();
</script>
