<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHOMP — Pac-Man Arcade | dannyahn</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#04040c;
    font-family:'Courier New', monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; color:#fff;
    -webkit-user-select:none; user-select:none;
  }
  #stage { position:relative; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; image-rendering:pixelated;
    width:min(94vw, calc(94vh * 0.8021)); height:auto; }
  /* CRT flourish */
  #crt {
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:multiply;
  }
  #vig {
    position:absolute; inset:0; pointer-events:none; z-index:6;
    background:radial-gradient(ellipse at center, transparent 62%, rgba(0,0,10,0.55) 100%);
  }
  .tag {
    position:absolute; top:10px; left:12px; z-index:10;
    background:rgba(4,4,16,0.88); border:1px solid #23235a;
    color:#ffd23f; font-weight:bold; letter-spacing:3px; font-size:13px;
    padding:6px 12px; border-radius:6px;
  }
  .tag small { color:#5a5aff; letter-spacing:1px; }
  #audioBtn {
    position:absolute; top:10px; right:12px; z-index:10; cursor:pointer;
    background:rgba(4,4,16,0.88); border:1px solid #23235a; color:#ffd23f;
    font-family:inherit; font-size:12px; letter-spacing:1px; padding:6px 12px; border-radius:6px;
  }
  #audioBtn:hover { border-color:#ffd23f; }
  .hintbar {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%); z-index:10;
    background:rgba(4,4,16,0.88); border:1px solid #1b1b44; color:#8f8fff;
    font-size:11px; letter-spacing:2px; padding:5px 14px; border-radius:6px; white-space:nowrap;
  }
  .hintbar b { color:#ffd23f; }
  /* touch dpad */
  #pad { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); z-index:11; display:none; }
  #pad div { display:flex; justify-content:center; gap:4px; }
  .pk {
    width:52px; height:52px; background:rgba(20,20,60,0.5); border:1px solid #3434a0;
    border-radius:10px; color:#ffd23f; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  .pk:active { background:rgba(255,210,63,0.25); }
  @media (pointer:coarse) { #pad { display:block; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="616" height="762"></canvas>
  <div id="crt"></div><div id="vig"></div>
  <div class="tag">CHOMP <small>// ARCADE CIRCUIT 11</small></div>
  <button id="audioBtn">SOUND: ON</button>
  <div class="hintbar"><b>ARROWS / WASD</b> MOVE &nbsp; <b>P</b> PAUSE &nbsp; <b>M</b> SOUND</button>
  <div id="pad">
    <div><span class="pk" data-d="U">&#9650;</span></div>
    <div><span class="pk" data-d="L">&#9664;</span><span class="pk" data-d="D">&#9660;</span><span class="pk" data-d="R">&#9654;</span></div>
  </div>
</div>
<script>
(function(){
'use strict';
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var TILE = 22, COLS = 28, HUD = 64;

// ---- maze: # wall, . dot, o power pellet, ' ' empty, - ghost door
// NOTE: pac spawn tile (13,20) is intentionally dot-free (classic).
var RAW = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.####      ####.######",
"######.####      ####.######",
"######.##          ##.######",
"######.######--######.######",
"######.##.###-### ###.######",
"######.##.#      #.##.######",
"######.##.#      #.##.######",
"      .##.########.##.      ",
"#......##....##....##......#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#............ .............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#............##............#",
"#o##########.##.##########o#",
"#.##########.##.##########.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#..........................#",
"############################"
];
var ROWS = RAW.length;
cv.width = COLS*TILE; cv.height = ROWS*TILE + HUD;
// validate geometry loudly (never silent)
for (var i=0;i<ROWS;i++) if (RAW[i].length!==COLS) throw new Error("maze row "+i+" width "+RAW[i].length);
var grid=[]; // 0 empty,1 wall,2 dot,3 power,4 door
var totalDots=0, dotsLeft=0;
function buildGrid(){
  grid=[]; totalDots=0;
  for (var y=0;y<ROWS;y++){ var row=[];
    for (var x=0;x<COLS;x++){ var c=RAW[y][x], v;
      if (c==='#') v=1; else if (c==='.') v=2; else if (c==='o') v=3; else if (c==='-') v=4; else v=0;
      if (v===2||v===3) totalDots++;
      row.push(v);
    } grid.push(row);
  }
  dotsLeft=totalDots;
}
function modX(x){ x%=COLS; if(x<0)x+=COLS; return x; }
// tile passability; x may be virtual (out of bounds) on tunnel row 16 — wraps.
function passable(tx,ty,forPac){
  if (ty<0||ty>=ROWS) return false;
  var v=grid[ty][modX(tx)];
  if (v===4) return forPac ? false : true; // door: ghosts pass, pac blocks
  return v!==1;
}
function inHouseArea(x,y){ return x>=11&&x<=16&&y>=12&&y<=15; }

// seeded RNG so QA runs are deterministic (fright mode is the only consumer)
var rngS=1;
function seedRng(s){ rngS=(s>>>0)||1; }
function rng(){ rngS ^= rngS<<13; rngS>>>=0; rngS ^= rngS>>>17; rngS ^= rngS<<5; rngS>>>=0; return rngS/4294967296; }

// ---- drawing the maze walls once to an offscreen canvas
var mazeCv=document.createElement('canvas');
mazeCv.width=COLS*TILE; mazeCv.height=ROWS*TILE;
function drawMaze(){
  var m=mazeCv.getContext('2d');
  m.clearRect(0,0,mazeCv.width,mazeCv.height);
  m.strokeStyle='#2233dd'; m.lineWidth=2.6; m.lineCap='round'; m.lineJoin='round';
  m.shadowColor='#2f4bff'; m.shadowBlur=7;
  var dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  for (var y=0;y<ROWS;y++) for (var x=0;x<COLS;x++){
    if (grid[y][x]!==1) continue;
    var cx=x*TILE+TILE/2, cy=y*TILE+TILE/2;
    for (var d=0; d<4; d++){
      var nx=x+dirs[d][0], ny=y+dirs[d][1];
      if (nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
      if (grid[ny][nx]===1){
        m.beginPath(); m.moveTo(cx,cy);
        m.lineTo(cx+dirs[d][0]*TILE/2, cy+dirs[d][1]*TILE/2);
        m.stroke();
      }
    }
  }
  // ghost door
  m.shadowBlur=4; m.shadowColor='#ff9ad5'; m.strokeStyle='#ff9ad5'; m.lineWidth=3;
  for (var yy=0;yy<ROWS;yy++) for (var xx=0;xx<COLS;xx++) if (grid[yy][xx]===4){
    m.beginPath(); m.moveTo(xx*TILE+2, yy*TILE+TILE/2); m.lineTo(xx*TILE+TILE-2, yy*TILE+TILE/2); m.stroke();
  }
}

// ---- audio (WebAudio, all synthesized, no assets)
var AC=null, audioOn=true, sirenNodes=null;
function ac(){ if(noauto) return null; if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function blip(f0,f1,dur,type,vol,when){
  var a=ac(); if(!a||!audioOn) return;
  var t=when||a.currentTime;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
var wakaFlip=false;
function sfxWaka(){ wakaFlip=!wakaFlip; blip(wakaFlip?320:180, wakaFlip?180:320, 0.07,'square',0.05); }
function sfxPower(){ startSiren(true); }
function sfxEatGhost(){ blip(120,900,0.35,'sawtooth',0.07); }
function sfxDeath(){
  var a=ac(); if(!a||!audioOn) return; var t=a.currentTime;
  for (var i=0;i<10;i++) blip(700-i*55, 620-i*55, 0.11,'triangle',0.08, t+i*0.12);
}
function sfxFruit(){ blip(1200,2200,0.12,'sine',0.08); if(ac()) blip(900,1700,0.16,'sine',0.06, ac().currentTime+0.06); }
function sfxReady(){ var a=ac(); if(!a||!audioOn) return; var t=a.currentTime;
  blip(392,392,0.12,'square',0.05,t); blip(523,523,0.12,'square',0.05,t+0.15); blip(659,659,0.2,'square',0.05,t+0.3);
}
function startSiren(on){
  var a=ac(); if(!a) return;
  if (on){ if (sirenNodes) return;
    var o=a.createOscillator(), g=a.createGain(), lfo=a.createOscillator(), lg=a.createGain();
    o.type='sawtooth'; o.frequency.value=90; g.gain.value=0.025;
    lfo.type='square'; lfo.frequency.value=5; lg.gain.value=30;
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(g); g.connect(a.destination); o.start(); lfo.start();
    sirenNodes={o:o,g:g,lfo:lfo};
  } else if (sirenNodes){
    try{ sirenNodes.o.stop(); sirenNodes.lfo.stop(); }catch(e){}
    sirenNodes=null;
  }
}
function tuneSiren(){ if (sirenNodes){ sirenNodes.lfo.frequency.value = 4 + level*1.4 + (1-dotsLeft/Math.max(1,totalDots))*7; } }
function audioToggle(){
  audioOn=!audioOn;
  document.getElementById('audioBtn').textContent='SOUND: '+(audioOn?'ON':'OFF');
  if (!audioOn){ startSiren(false); } else { if (mode==='play') startSiren(ghostFright>0); }
}
document.getElementById('audioBtn').addEventListener('click', function(){ ac(); audioToggle(); });

// ---- game state
var mode='title'; // title, ready, play, dying, clear, over, paused
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var score=0, hiScore=+(lsGet('test11-chomp-hi')||0), lives=3, level=1;
var stateT=0, clearFlash=0;
var ghostCombo=0, ghostFright=0, frightDur=6;
var modeWave=0; var WAVES=[7,20,7,20,5,20,5,1e9]; var waveT=0, scatter=true;
var dotsEatenSinceFruit=0, fruitT=0, fruitOn=false, fruitType=0;
var FRUITS=[['CHERRY',100,'#ff2d2d'],['STRAWBERRY',300,'#ff5b8d'],['ORANGE',500,'#ff9d2d'],['APPLE',700,'#ff3b3b']];
var popups=[];
function popup(x,y,txt,col){ popups.push({x:x,y:y,txt:txt,col:col||'#fff',t:1.2}); }

var DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],N:[0,0]};
// Entities move along one axis at a time toward a target tile centre. Turns happen
// exactly on centre with leftover travel carried into the new direction => smooth,
// no snap-back, no jitter. `desired` is a persistent input buffer honoured at the
// next junction, so a press slightly before the corner is always respected.
function ent(kind,x,y,dir,spd){ return {kind:kind,x:x,y:y,dir:dir.slice(),desired:dir.slice(),
  tx:x+dir[0],ty:y+dir[1],spd:spd,stop:false,anim:0,state:'normal',relT:0,bobT:0,
  homeX:x,homeY:y,px:x,py:y};
}
var pac, ghosts;
var SPAWN={x:13,y:20};
function resetActors(){
  pac=ent('pac',SPAWN.x,SPAWN.y,DIR.L,8.6); pac.stop=true; pac.desired=DIR.L.slice();
  ghosts=[
    ent('blinky',13,11,DIR.L,8),
    ent('pinky',13,14,DIR.U,8),
    ent('inky',12,14,DIR.U,8),
    ent('clyde',15,14,DIR.U,8)
  ];
  ghosts[0].state='normal';
  ghosts[1].state='house'; ghosts[1].relT=2;
  ghosts[2].state='house'; ghosts[2].relT=7;
  ghosts[3].state='house'; ghosts[3].relT=13;
  modeWave=0; waveT=0; scatter=true; ghostFright=0; ghostCombo=0;
  startSiren(false);
}
function newLevel(){
  buildGrid(); drawMaze(); resetActors();
  fruitOn=false; fruitT=0; dotsEatenSinceFruit=0;
  frightDur=Math.max(2, 7-(level-1));
  mode='ready'; stateT=0; sfxReady();
}
function newGame(){ score=0; lives=3; level=1; popups=[]; newLevel(); }

// ---- shared axis-locked stepping. Returns leftover >=0 when entity snapped onto
// its target tile this frame, -1 otherwise.
function advance(e,step){
  var dx=e.tx-e.x, dy=e.ty-e.y, d=Math.abs(dx)+Math.abs(dy);
  if (d<=step+1e-9){ var rem=step-d; e.x=e.tx; e.y=e.ty; return rem; }
  e.x+=dx/d*step; e.y+=dy/d*step; return -1;
}
// tunnel wrap keeps positions in [-0.5, COLS-0.5); targets shift with them
function wrapE(e){
  if (e.x < -0.5){ e.x+=COLS; e.tx+=COLS; }
  else if (e.x >= COLS-0.5){ e.x-=COLS; e.tx-=COLS; }
}
function centerOf(e){ return {x:modX(Math.round(e.x)), y:Math.round(e.y)}; }

// ---- ghost targeting
function scatterTarget(g){
  if (g.kind==='blinky') return {x:COLS-2,y:1};
  if (g.kind==='pinky')  return {x:1,y:1};
  if (g.kind==='inky')   return {x:COLS-2,y:ROWS-2};
  return {x:1,y:ROWS-2};
}
function chaseTarget(g){
  if (g.kind==='blinky') return {x:pac.x,y:pac.y};
  if (g.kind==='pinky'){ return {x:pac.x+pac.dir[0]*4, y:pac.y+pac.dir[1]*4}; }
  if (g.kind==='inky'){
    var b=ghosts[0], ax=b.x+b.dir[0]*2, ay=b.y+b.dir[1]*2;
    return {x:ax+(ax-pac.x), y:ay+(ay-pac.y)};
  }
  var d=Math.hypot(wrapDx(g.x,pac.x),g.y-pac.y);
  return d>8 ? {x:pac.x,y:pac.y} : scatterTarget(g);
}
function wrapDx(a,b){ var d=Math.abs(a-b); return Math.min(d, COLS-d); }
var PREC=[[0,-1],[-1,0],[0,1],[1,0]]; // classic tie priority: up,left,down,right
function ghostSpeed(g){
  if (g.state==='eyes') return 13;
  if (g.state==='fright') return ghostSpdFright();
  var s = 7.6 + level*0.5 + (dotsLeft<20?1:0);
  if (g.state==='leaving') return s*1.5;
  if (g.y>=15.5&&g.y<=16.5) s*=0.62; // tunnel slowdown
  return Math.min(11,s);
}
function ghostSpdFright(){ return Math.max(3.5, 5.5-level*0.3); }
function stepGhost(g,dt){
  g.px=g.x; g.py=g.y;
  // waiting in house: bob until release timer expires
  if (g.state==='house'){
    g.bobT+=dt; g.y=g.homeY+Math.sin(g.bobT*10)*0.28; g.relT-=dt;
    if (g.relT<=0){
      g.state='leaving'; g.y=g.homeY; g.x=13; g.tx=13; g.ty=11; g.dir=[0,-1];
    }
    return;
  }
  // exiting house: straight up through the door, then join the corridor
  if (g.state==='leaving'){
    var remL=advance(g,ghostSpeed(g)*dt);
    if (remL>=0){ g.state=ghostFright>0?'fright':'normal'; g.dir=DIR.L.slice(); g.tx=12; g.ty=11; }
    wrapE(g);
    return;
  }
  // revive: eyes reached door top -> descend into house
  if (g.state==='revive'){
    advance(g,13*dt); wrapE(g);
    if (Math.abs(g.x-13)<1e-9 && Math.abs(g.y-14)<1e-9){
      g.state='house'; g.relT=0.4; g.bobT=0; g.homeX=13; g.homeY=14;
      g.tx=13; g.ty=14;
    }
    return;
  }
  var rem=advance(g,ghostSpeed(g)*dt);
  wrapE(g);
  if (rem<0) return;
  var c=centerOf(g), cx=c.x, cy=c.y;
  // eyes arrived at the house door -> revive sequence
  if (g.state==='eyes' && cx===13 && cy===11){
    g.state='revive'; g.dir=DIR.D.slice(); g.tx=13; g.ty=14;
    return;
  }
  // choose direction at tile centre
  var rev=[-g.dir[0],-g.dir[1]];
  var opts=[], nonRev=[];
  for (var i=0;i<4;i++){
    var d=PREC[i], nx=cx+d[0], ny=cy+d[1];
    if (!passable(nx,ny,false)) continue;
    // live ghosts never re-enter the house block
    if (g.state!=='eyes' && inHouseArea(nx,ny)) continue;
    opts.push(d);
    if (!(d[0]===rev[0]&&d[1]===rev[1])) nonRev.push(d);
  }
  if (!opts.length){ opts.push(rev.slice()); nonRev=opts; } // dead-end safety
  var cand = (g.state==='fright'||g.state==='eyes') ? opts : (nonRev.length?nonRev:opts);
  var best=null;
  if (g.state==='fright'){
    best=cand[(rng()*cand.length)|0];
  } else {
    var tgt = (g.state==='eyes') ? {x:13,y:11} : (scatter?scatterTarget(g):chaseTarget(g));
    var bd=1e18;
    for (var j=0;j<cand.length;j++){
      var ddx=cand[j][0]+cx-tgt.x, ddy=cand[j][1]+cy-tgt.y;
      var dd=ddx*ddx+ddy*ddy;
      if (dd<bd-1e-9){bd=dd;best=cand[j];}
    }
  }
  g.dir=best.slice(); g.tx=cx+best[0]; g.ty=cy+best[1];
  // carry leftover travel into the new heading (no per-junction stutter)
  g.x+=best[0]*rem; g.y+=best[1]*rem;
}

// ---- pac movement
function stepPac(dt){
  pac.px=pac.x; pac.py=pac.y;
  if (pac.stop && !(pac.desired[0]||pac.desired[1])){ return; }
  if (pac.stop){
    // stopped at a centre: try to depart with the buffered direction
    var s0={x:modX(Math.round(pac.x)),y:Math.round(pac.y)};
    pac.x=s0.x; pac.y=s0.y;
    var D0=pac.desired;
    if (passable(s0.x+D0[0],s0.y+D0[1],true)){
      pac.stop=false; pac.dir=D0.slice(); pac.tx=s0.x+D0[0]; pac.ty=s0.y+D0[1];
    } else { return; }
  }
  var rem=advance(pac,pac.spd*dt);
  wrapE(pac);
  // eat: tile currently under pac within eating radius of its centre
  var c0=centerOf(pac);
  var edx=wrapDx(pac.x,c0.x);
  if (edx<0.5 && Math.abs(pac.y-c0.y)<0.5){
    var v=grid[c0.y][c0.x];
    if (v===2){ grid[c0.y][c0.x]=0; dotsLeft--; dotsEatenSinceFruit++; score+=10; sfxWaka(); tuneSiren(); fruitCheck(); }
    else if (v===3){ grid[c0.y][c0.x]=0; dotsLeft--; dotsEatenSinceFruit++; score+=50; sfxWaka(); startFright(); }
  }
  if (rem>=0){
    var c=centerOf(pac), cx=c.x, cy=c.y;
    var D=pac.desired, use=null;
    if ((D[0]||D[1]) && passable(cx+D[0],cy+D[1],true)) use=D;
    else if ((pac.dir[0]||pac.dir[1]) && passable(cx+pac.dir[0],cy+pac.dir[1],true)) use=pac.dir;
    if (use){
      pac.dir=use.slice(); pac.tx=cx+use[0]; pac.ty=cy+use[1]; pac.stop=false;
      pac.x+=use[0]*rem; pac.y+=use[1]*rem; // carry: corner "before" centre visually
    } else {
      pac.stop=true; pac.x=cx; pac.y=cy; pac.tx=cx; pac.ty=cy;
    }
  }
  if (!pac.stop) pac.anim+=dt*10;
}
function startFright(){
  ghostFright=frightDur; ghostCombo=0;
  for (var i=0;i<4;i++){ var g=ghosts[i];
    if (g.state==='normal'){ g.state='fright'; g.dir=[-g.dir[0],-g.dir[1]];
      // retarget to the next tile centre ahead after reversing
      if (g.dir[0]!==0){ g.tx=(g.dir[0]>0?Math.ceil(g.x):Math.floor(g.x)); g.ty=g.y; }
      else if (g.dir[1]!==0){ g.ty=(g.dir[1]>0?Math.ceil(g.y):Math.floor(g.y)); g.tx=g.x; }
    } }
  startSiren(false); sfxPower();
}
function fruitCheck(){ if(!fruitOn && (dotsEatenSinceFruit===70||dotsEatenSinceFruit===170)){ fruitOn=true; fruitT=9; fruitType=Math.min(3,Math.floor((level-1)/2)); popup(13,10,FRUITS[fruitType][0],FRUITS[fruitType][1]); sfxFruit(); } }

// ---- collisions (swept: sample start/mid of each actor's frame path so fast
// ghosts can never tunnel through pac between frames)
function hitPoint(a,b){ return wrapDx(a.x,b.x)<0.5 && Math.abs(a.y-b.y)<0.5; }
function collide(){
  var pm={x:(pac.x+pac.px)/2,y:(pac.y+pac.py)/2};
  for (var i=0;i<4;i++){ var g=ghosts[i];
    if (g.state==='house'||g.state==='revive'||(g.state==='leaving'&&g.y>13.5)) continue;
    var gm={x:(g.x+g.px)/2,y:(g.y+g.py)/2};
    var hit = hitPoint(pac,g)||hitPoint(pac,gm)||hitPoint(pm,g)||hitPoint(pm,gm);
    if (hit){
      if (g.state==='fright'){
        g.state='eyes'; var pts=200*Math.pow(2,ghostCombo); ghostCombo++;
        score+=pts; popup(g.x,g.y,''+pts,'#5bd0ff'); sfxEatGhost();
        // eyes head for the house door
        g.dir=g.dir.slice();
      } else if (g.state!=='eyes'){
        lives--; mode='dying'; stateT=0; startSiren(false); sfxDeath(); return;
      }
    }
  }
}

// ---- modes / waves
function updateModes(dt){
  if (ghostFright>0){ ghostFright-=dt; if(ghostFright<=0){
    ghostFright=0;
    for (var i=0;i<4;i++) if(ghosts[i].state==='fright') ghosts[i].state='normal';
    if (mode==='play') startSiren(true);
  } return; }
  waveT+=dt;
  if (waveT>=WAVES[modeWave]){ waveT=0; modeWave=Math.min(modeWave+1,WAVES.length-1); scatter=!scatter;
    for (var j=0;j<4;j++){ var g=ghosts[j];
      if (g.state==='normal'||g.state==='fright'){
        g.dir=[-g.dir[0],-g.dir[1]];
        if (g.dir[0]!==0){ g.tx=(g.dir[0]>0?Math.ceil(g.x):Math.floor(g.x)); g.ty=g.y; }
        else if (g.dir[1]!==0){ g.ty=(g.dir[1]>0?Math.ceil(g.y):Math.floor(g.y)); g.tx=g.x; }
      } } }
}

// ---- drawing
function drawPac(){
  var px=pac.x*TILE+TILE/2, py=pac.y*TILE+TILE/2+HUD, r=TILE*0.58;
  if (mode==='dying'){ var p=Math.min(1,stateT/1.6); var open=0.0001+p*Math.PI;
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.moveTo(px,py);
    ctx.arc(px,py,r*(1-p*0.9),-open/2,open/2); ctx.closePath(); ctx.fill();
    if(p>=1) return;
  }
  var mx=pac.dir[0], my=pac.dir[1];
  var ang=(mx||my)?Math.atan2(my,mx):0;
  var mouth=0.06*Math.PI+0.26*Math.PI*(0.5+0.5*Math.sin(pac.anim*3));
  if (pac.stop) mouth=0.18*Math.PI;
  ctx.fillStyle='#ffd23f';
  ctx.shadowColor='#ffd23f'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.moveTo(px,py);
  ctx.arc(px,py,r,ang+mouth,ang-mouth+Math.PI*2);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
}
function drawGhost(g){
  var gx=g.x*TILE+TILE/2, gy=g.y*TILE+TILE/2+HUD, r=TILE*0.6;
  var body = g.state==='eyes' ? null :
             g.state==='fright' ? ((ghostFright<1.5 && (((stateT*8)|0)%2)) ? '#fff' : '#2121ff') :
             ({blinky:'#ff2d2d',pinky:'#ffb8de',inky:'#5bd0ff',clyde:'#ffb13d'})[g.kind];
  ctx.beginPath();
  ctx.arc(gx,gy-2,r,Math.PI,0);
  var feet=6, w=2*r/feet, t=performance.now()/90;
  ctx.lineTo(gx+r,gy+r-3);
  for (var i=0;i<feet;i++){
    var up=((i+((t|0)))%2===0);
    ctx.lineTo(gx+r-w*(i+0.5), gy+r-3+(up?0:3.2));
    ctx.lineTo(gx+r-w*(i+1), gy+r-3);
  }
  ctx.closePath();
  if (body){ ctx.fillStyle=body; ctx.shadowColor=body; ctx.shadowBlur=5; ctx.fill(); ctx.shadowBlur=0; }
  // eyes
  var ex=g.dir[0]*2.4, ey=g.dir[1]*2.4;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(gx-r*0.36,gy-3.5,3.4,4.2,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(gx+r*0.36,gy-3.5,3.4,4.2,0,0,7); ctx.fill();
  ctx.fillStyle='#1b2cff';
  ctx.beginPath(); ctx.arc(gx-r*0.36+ex,gy-3.5+ey,1.8,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(gx+r*0.36+ex,gy-3.5+ey,1.8,0,7); ctx.fill();
  if (g.state==='fright'){
    ctx.fillStyle= body==='#fff'?'#f00':'#fff';
    ctx.beginPath(); ctx.arc(gx-r*0.36,gy-3.5,1.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(gx+r*0.36,gy-3.5,1.6,0,7); ctx.fill();
    ctx.strokeStyle= body==='#fff'?'#f00':'#fff'; ctx.lineWidth=1.4;
    ctx.beginPath();
    for (var z=0;z<4;z++){ ctx.moveTo(gx-6+z*4,gy+3); ctx.lineTo(gx-4+z*4,gy+1); ctx.lineTo(gx-2+z*4,gy+3); }
    ctx.stroke();
  }
}
function drawHUD(){
  ctx.fillStyle='#04040c'; ctx.fillRect(0,0,cv.width,HUD);
  ctx.font='bold 13px "Courier New",monospace';
  ctx.fillStyle='#9aa0ff'; ctx.textAlign='left'; ctx.fillText('1UP', 16, 20);
  ctx.fillStyle='#fff'; ctx.fillText((''+score).padStart(6,'0'), 16, 40);
  ctx.fillStyle='#9aa0ff'; ctx.textAlign='center'; ctx.fillText('HIGH SCORE', cv.width/2, 20);
  ctx.fillStyle='#ffd23f'; ctx.fillText((''+hiScore).padStart(6,'0'), cv.width/2, 40);
  ctx.fillStyle='#9aa0ff'; ctx.textAlign='right'; ctx.fillText('LEVEL '+level, cv.width-16, 20);
  // lives
  ctx.fillStyle='#ffd23f';
  for (var i=0;i<lives-1;i++){
    var lx=cv.width-24-i*22, ly=42;
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.arc(lx,ly,8,0.25,Math.PI*2-0.25); ctx.closePath(); ctx.fill();
  }
}
function drawDots(){
  ctx.fillStyle='#ffc9a3';
  for (var y=0;y<ROWS;y++) for (var x=0;x<COLS;x++){
    var v=grid[y][x];
    if (v===2){ ctx.fillRect(x*TILE+TILE/2-1.6, y*TILE+TILE/2-1.6+HUD, 3.2, 3.2); }
    else if (v===3){
      var pulse=0.5+0.5*Math.sin(performance.now()/140);
      ctx.fillStyle='rgba(255,201,163,'+(0.55+0.45*pulse)+')';
      ctx.beginPath(); ctx.arc(x*TILE+TILE/2, y*TILE+TILE/2+HUD, 5.2, 0, 7); ctx.fill();
      ctx.fillStyle='#ffc9a3';
    }
  }
}
function drawFruit(){
  if (!fruitOn) return;
  var fx=13*TILE+TILE/2, fy=10*TILE+TILE/2+HUD;
  var col=FRUITS[fruitType][1];
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.arc(fx-4,fy+2,5,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(fx+4,fy+3,5,0,7); ctx.fill();
  ctx.strokeStyle='#3fae4a'; ctx.lineWidth=2; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.moveTo(fx-2,fy-2); ctx.quadraticCurveTo(fx,fy-10,fx+5,fy-8); ctx.stroke();
  ctx.font='bold 10px "Courier New",monospace'; ctx.fillStyle=col; ctx.textAlign='center';
  ctx.fillText(FRUITS[fruitType][0], fx, fy+22);
  ctx.shadowBlur=0;
}
function centerText(txt,y,col,size){
  ctx.font='bold '+(size||16)+'px "Courier New",monospace';
  ctx.textAlign='center'; ctx.fillStyle=col||'#ffd23f';
  ctx.fillText(txt, cv.width/2, y+HUD);
}
function draw(){
  ctx.fillStyle='#04040c'; ctx.fillRect(0,0,cv.width,cv.height);
  drawHUD();
  if (!(mode==='clear' && (((stateT*5)|0)%2===0))) ctx.drawImage(mazeCv,0,HUD);
  drawDots(); drawFruit();
  if (mode!=='title'){
    for (var i=0;i<4;i++) drawGhost(ghosts[i]);
    if (mode!=='dying' || stateT<1.7) drawPac();
  }
  // popups
  ctx.font='bold 11px "Courier New",monospace'; ctx.textAlign='center';
  for (var p=0;p<popups.length;p++){ var pp=popups[p];
    ctx.fillStyle=pp.col; ctx.globalAlpha=Math.min(1,pp.t);
    ctx.fillText(pp.txt, pp.x*TILE+TILE/2, pp.y*TILE+HUD);
    ctx.globalAlpha=1;
  }
  if (mode==='title'){
    centerText('C H O M P', 200, '#ffd23f', 30);
    centerText('A VANILLA-ARCADE CIRCUIT', 226, '#8f8fff', 11);
    centerText('PRESS AN ARROW KEY TO START', 262, '#fff', 13);
    // ghosts parade
    drawGhost({x:8.5,y:15,dir:[1,0],state:'normal',kind:'blinky'});
    drawGhost({x:11.5,y:15,dir:[1,0],state:'normal',kind:'pinky'});
    drawGhost({x:14.5,y:15,dir:[1,0],state:'normal',kind:'inky'});
    drawGhost({x:17.5,y:15,dir:[1,0],state:'normal',kind:'clyde'});
  }
  if (mode==='ready') centerText('READY!', 190, '#ffd23f', 18);
  if (mode==='over') centerText('GAME OVER', 190, '#ff2d2d', 20);
  if (mode==='over' && stateT>1.2) centerText('PRESS ENTER TO RETRY', 214, '#fff', 12);
  if (mode==='paused') centerText('PAUSED', 190, '#5bd0ff', 18);
}

// ---- main loop
var last=0;
// ?noauto suppresses the rAF loop + audio so the QA harness can drive frame()
// deterministically via __chomp.tick(). Normal browsing is unaffected.
var noauto=/[?&]noauto/.test((typeof location!=='undefined'&&location.search)||'');
function frame(ts){
  if (!noauto) requestAnimationFrame(frame);
  var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
  stateT+=dt;
  if (mode==='title'){ draw(); return; }
  if (mode==='paused'){ draw(); return; }
  if (mode==='ready'){ if (stateT>1.6){ mode='play'; waveT=0; startSiren(true); } draw(); return; }
  if (mode==='dying'){ if (stateT>2.2){
      if (lives<=0){ mode='over'; stateT=0; if(score>hiScore){hiScore=score;lsSet('test11-chomp-hi',hiScore);} }
      else { resetActors(); mode='ready'; stateT=0; }
    } draw(); return; }
  if (mode==='clear'){ clearFlash+=dt; if (stateT>2.6){ level++; newLevel(); } draw(); return; }
  if (mode==='over'){ draw(); return; }
  // play
  stepPac(dt);
  updateModes(dt);
  for (var i=0;i<4;i++) stepGhost(ghosts[i],dt);
  collide();
  // fruit timer
  if (fruitOn){ fruitT-=dt;
    if (wrapDx(pac.x,13)<0.8 && Math.abs(pac.y-10)<0.8){ score+=FRUITS[fruitType][1]; popup(13,10,'+'+FRUITS[fruitType][1],'#ffd23f'); sfxFruit(); fruitOn=false; }
    else if (fruitT<=0) fruitOn=false;
  }
  for (var p=popups.length-1;p>=0;p--){ popups[p].t-=dt; popups[p].y-=dt*1.5; if (popups[p].t<=0) popups.splice(p,1); }
  if (score>hiScore){ hiScore=score; lsSet('test11-chomp-hi',hiScore); }
  if (dotsLeft<=0){ mode='clear'; stateT=0; startSiren(false); }
  draw();
}

// ---- input
function setDir(k){
  if (mode==='title'){ newGame(); startSiren(false); }
  if (!pac) return;
  var D=DIR[k]; if (!D) return;
  var cur=pac.dir;
  // instant reverse, available anywhere (not just on tile centres)
  if (D[0]===-cur[0] && D[1]===-cur[1] && (cur[0]||cur[1]) && !pac.stop){
    pac.dir=D.slice(); pac.desired=D.slice();
    // retarget to the next tile centre ahead in the new heading
    if (D[0]!==0){ pac.tx=(D[0]>0?Math.ceil(pac.x):Math.floor(pac.x)); pac.ty=Math.round(pac.y); }
    else { pac.ty=(D[1]>0?Math.ceil(pac.y):Math.floor(pac.y)); pac.tx=modX(Math.round(pac.x)); }
    return;
  }
  // persistent input buffer, honoured at next tile centre
  pac.desired=D.slice();
  if (pac.stop){ pac.stop=false; pac.dir=D.slice(); }
}
var KEYS={ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'};
window.addEventListener('keydown', function(e){
  ac();
  if (KEYS[e.code]){ e.preventDefault(); setDir(KEYS[e.code]); }
  if (e.code==='KeyM'){ audioToggle(); }
  if (e.code==='KeyP' && (mode==='play'||mode==='paused')){ mode = mode==='play'?'paused':'play'; }
  if (e.code==='Enter' && mode==='over'){ newGame(); }
});
// dpad
var padEls=document.querySelectorAll('.pk');
for (var k=0;k<padEls.length;k++) (function(el){
  el.addEventListener('touchstart', function(e){ e.preventDefault(); ac(); setDir(el.getAttribute('data-d')); });
  el.addEventListener('click', function(){ ac(); setDir(el.getAttribute('data-d')); });
})(padEls[k]);
// swipe
var tx=null,ty=null;
cv.addEventListener('touchstart',function(e){ var t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; ac(); });
cv.addEventListener('touchend',function(e){ if(tx===null)return; var t=e.changedTouches[0];
  var dx=t.clientX-tx, dy=t.clientY-ty;
  if (Math.abs(dx)<18&&Math.abs(dy)<18){ if(mode==='title')setDir('L'); return; }
  setDir(Math.abs(dx)>Math.abs(dy)? (dx>0?'R':'L') : (dy>0?'D':'U'));
  tx=ty=null;
});

// ---- boot
buildGrid(); drawMaze(); resetActors(); mode='title'; stateT=0;

// ---- QA test hook (headless driving, see qa/test11-qa.js)
window.__chomp = {
  get mode(){return mode;}, get score(){return score;}, get dots(){return dotsLeft;},
  get totalDots(){return totalDots;}, get lives(){return lives;}, get level(){return level;},
  get fright(){return ghostFright;}, get scatter(){return scatter;}, get fruitOn(){return fruitOn;},
  get hiScore(){return hiScore;},
  tick:function(tsMs){ frame(tsMs); },
  press:function(d){ setDir(d); },
  pac:function(){ return {x:pac.x,y:pac.y,dir:pac.dir.slice(),stop:pac.stop}; },
  ghosts:function(){ return ghosts.map(function(g){ return {kind:g.kind,x:g.x,y:g.y,dir:g.dir.slice(),state:g.state}; }); },
  grid:function(){ return grid.map(function(r){return r.slice();}); },
  teleport:function(who,x,y,dirName){
    var e = who==='pac' ? pac : ghosts.filter(function(g){return g.kind===who;})[0];
    if (!e) return false;
    x=Math.round(x); y=Math.round(y);
    var D = DIR[dirName]||DIR.N;
    e.x=x; e.y=y; e.px=x; e.py=y; e.dir=D.slice(); e.desired=D.slice();
    e.tx=x+D[0]; e.ty=y+D[1]; e.stop=false;
    // pac obeys walls: if facing one, stop at the centre like a real player press
    if (who==='pac' && (D[0]||D[1]) && !passable(x+D[0],y+D[1],true)){
      e.tx=x; e.ty=y; e.stop=true;
    }
    return true;
  },
  setGhostState:function(kind,state){
    var g=ghosts.filter(function(q){return q.kind===kind;})[0]; if(!g) return false;
    g.state=state; if(state==='normal'&&g.relT>0)g.relT=0; return true;
  },
  parkGhosts:function(){ for(var i=0;i<4;i++){ var g=ghosts[i];
    g.state='house'; g.relT=1e9; g.bobT=0; g.x=g.homeX; g.y=g.homeY; g.tx=g.x; g.ty=g.y; } return true; },
  get dotsEaten(){return dotsEatenSinceFruit;},
  setDotsEaten:function(n){ dotsEatenSinceFruit=n; return true; },
  startGame:function(){ newGame(); if(mode==='ready'){mode='play';} return true; },
  clearAllDots:function(){ for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++) if(grid[y][x]===2||grid[y][x]===3){grid[y][x]=0;dotsLeft--;} return true; },
  seed:function(s){ seedRng(s); return true; },
  forceDeath:function(){ if (mode!=='play') return false;
    lives--; mode='dying'; stateT=0; startSiren(false); sfxDeath(); return true; }
};
requestAnimationFrame = (typeof requestAnimationFrame!=='function') ? function(){ return 0; } : requestAnimationFrame;
if (!/[?&]noauto/.test((typeof location!=='undefined'&&location.search)||'')) requestAnimationFrame(frame);
})();
</script>
