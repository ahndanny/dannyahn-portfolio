<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Pagoda Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/objects/Reflector.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d18; font-family: 'Inter', sans-serif; }
  #scene { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 20px; right: 20px; width: 248px; z-index: 10;
    background: rgba(16, 20, 32, 0.62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 18px 18px 16px;
    color: #e8ecf4; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  #panel h1 { font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 2px; }
  #panel .sub { font-size: 10.5px; font-weight: 300; color: rgba(232,236,244,0.55); letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 16px; }
  .ctl-label { font-size: 11px; font-weight: 400; color: rgba(232,236,244,0.75); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .ctl-label span:last-child { color: rgba(255,199,120,0.9); }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, #f5c96b, #3a4a7a); outline: none; margin-bottom: 18px; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 0 10px rgba(255,190,110,0.7); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 0 10px rgba(255,190,110,0.7); cursor: pointer; }
  #gustBtn {
    width: 100%; padding: 10px 0; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
    background: rgba(255,255,255,0.08); color: #e8ecf4; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.6px; cursor: pointer; transition: background 0.25s, transform 0.12s;
  }
  #gustBtn:hover { background: rgba(255,255,255,0.16); }
  #gustBtn:active { transform: scale(0.97); }
  #gustBtn.blowing { background: rgba(255,150,180,0.30); border-color: rgba(255,170,195,0.5); }
  .hint { margin-top: 14px; font-size: 10px; font-weight: 300; color: rgba(232,236,244,0.45); line-height: 1.7; }
  #fps { position: fixed; bottom: 16px; right: 20px; z-index: 10; font-size: 10.5px; font-weight: 300; letter-spacing: 1px; color: rgba(232,236,244,0.5); }
  #toast {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%) translateY(8px); z-index: 10;
    background: rgba(16,20,32,0.72); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    color: #f2d9ae; padding: 9px 18px; font-size: 12.5px; letter-spacing: 0.4px; opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease; font-family: 'Shippori Mincho', serif;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="scene"></div>

<div id="panel">
  <h1>Pagoda Garden</h1>
  <div class="sub">Voxel Zen</div>
  <div class="ctl-label"><span>Time of Day</span><span id="todVal">Day</span></div>
  <input type="range" id="todSlider" min="0" max="100" value="0">
  <button id="gustBtn">Wind Gust</button>
  <div class="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan<br>Click the torii gate, lanterns, door or the water</div>
</div>
<div id="fps"></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     PHASE 1 — INITIALIZATION: scene, camera, renderer, composer, lights
     ============================================================ */
  var COL = {
    skyDay:  new THREE.Color(0x7fb0dd), skyNight: new THREE.Color(0x05070f),
    grass:   [0x4e8a33, 0x5aa43c, 0x467c2a, 0x69b54a],
    stone:   [0x9a9a92, 0x8b8b84, 0xa8a8a0],
    darkWood:[0x3a2c20, 0x42311f],
    wall:    [0xefe3c8, 0xe4d7ba],
    roof:    [0x2f3640, 0x363e4a],
    sakura:  [0xf887c0, 0xe866ab, 0xfbb6da, 0xd94f9e],
    trunk:   [0x4a3628, 0x3f2e21],
    red:     0xd8402f,
    lantern: 0xffb85c,
    bridge:  0xc74b33,
    water:   0x2e7f9e
  };

  var scene = new THREE.Scene();
  scene.background = COL.skyDay.clone();
  scene.fog = new THREE.Fog(COL.skyDay.clone(), 55, 140);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('scene').appendChild(renderer.domElement);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 320);
  camera.position.set(19, 10.5, 16);

  // Bloom pipeline (the showcase layer)
  var composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.55, 0.90);
  composer.addPass(bloomPass);

  var hemi = new THREE.HemisphereLight(0xbfd9ea, 0x5a7a44, 0.55);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xffe8c4, 1.3);
  sun.position.set(28, 36, 14);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -42; sun.shadow.camera.right = 42;
  sun.shadow.camera.top = 42; sun.shadow.camera.bottom = -42;
  sun.shadow.camera.far = 130;
  sun.shadow.bias = -0.0004;
  sun.shadow.radius = 4;
  scene.add(sun);

  var baseGround = new THREE.Mesh(
    new THREE.PlaneGeometry(180, 180),
    new THREE.MeshStandardMaterial({ color: 0x467c2a, roughness: 1 })
  );
  baseGround.rotation.x = -Math.PI / 2;
  baseGround.position.y = -0.05;
  baseGround.receiveShadow = true;
  scene.add(baseGround);

  /* ============================================================
     PHASE 2 — ASSET GENERATION
     ============================================================ */
  var vGrass = [], vStone = [], vDark = [], vWall = [], vRoof = [], vSakura = [], vTrunk = [], vBridge = [], vFence = [];
  var vTorii = [], vLantern = [];

  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function pushV(bucket, x, y, z, color, s, ry) {
    bucket.push({ x: x, y: y, z: z, c: (typeof color === 'number') ? color : pick(color), s: s || 1, ry: ry || 0 });
  }
  function jitterColor(hex, amt) {
    var c = new THREE.Color(hex);
    var j = amt || 0.06;
    c.r = Math.min(1, Math.max(0, c.r + (Math.random() - 0.5) * j));
    c.g = Math.min(1, Math.max(0, c.g + (Math.random() - 0.5) * j));
    c.b = Math.min(1, Math.max(0, c.b + (Math.random() - 0.5) * j));
    return c.getHex();
  }

  var POND = { cx: 9.5, cz: 0, r: 6.2, waterY: 0.34 };
  function inPond(x, z) { var dx = x - POND.cx, dz = z - POND.cz; return dx * dx + dz * dz < (POND.r + 1.1) * (POND.r + 1.1); }
  function onPath(x, z) { return (x > 16.5 && x < 21.5 && Math.abs(z) < 1.6) || (x > 5.5 && x < 16.5 && Math.abs(z) < 1.2); }

  // Grass field
  for (var gx = -26; gx <= 27; gx++) {
    for (var gz = -23; gz <= 23; gz++) {
      if (inPond(gx, gz) || onPath(gx, gz)) continue;
      if (Math.random() < 0.22) continue;
      pushV(vGrass, gx + (Math.random() - 0.5) * 0.4, 0.18 + Math.random() * 0.12, gz + (Math.random() - 0.5) * 0.4,
            pick(COL.grass), 0.85 + Math.random() * 0.3);
    }
  }

  // Stone path: entrance -> torii -> bridge approach
  for (var px = 17; px <= 21; px += 1) for (var pz = -1; pz <= 1; pz += 1)
    if (Math.random() < 0.92) pushV(vStone, px, 0.16, pz, COL.stone, 0.95);
  for (var sx = 15; sx <= 16.5; sx += 1) pushV(vStone, sx, 0.16, 0, COL.stone, 0.95);
  // stepping stones along the pond edge
  [[7.5, -5.5], [9.5, -6.2], [11.5, -5.3], [13, -3.8]].forEach(function (sp) { pushV(vStone, sp[0], 0.28, sp[1], COL.stone, 0.9); });

  // Low zen fence along back and left edges
  for (var fx = -24; fx <= 8; fx += 2) {
    for (var fh = 0.5; fh <= 1.6; fh += 0.55) pushV(vFence, fx, fh, -21, COL.darkWood, 0.7);
    if (fx % 4 === 0) pushV(vFence, fx, 1.85, -21, COL.darkWood, 0.8);
  }
  for (var fz = -19; fz <= 10; fz += 2) {
    for (var fh2 = 0.5; fh2 <= 1.6; fh2 += 0.55) pushV(vFence, -24, fh2, fz, COL.darkWood, 0.7);
    if (fz % 4 === 0) pushV(vFence, -24, 1.85, fz, COL.darkWood, 0.8);
  }

  // ---- Pagoda ----
  var sorinGold = 0xe0bb5e;
  function buildPagoda() {
    var bx = 0, bz = 0;
    for (var ring = 0; ring < 3; ring++) {
      var half = 6.5 - ring;
      for (var x = -half; x <= half; x++) for (var z = -half; z <= half; z++) {
        if (x === -half || z === -half || x === half || z === half) {
          pushV(vStone, bx + x, 0.35 + ring * 0.32, bz + z, COL.stone, 0.97);
        }
      }
    }
    var y0 = 1.55;
    var stories = [
      { wall: 4.5, wallH: 2.6, roof: 6.4 },
      { wall: 3.7, wallH: 2.2, roof: 5.4 },
      { wall: 2.9, wallH: 2.0, roof: 4.5 },
      { wall: 2.2, wallH: 1.8, roof: 3.6 }
    ];
    var y = y0;
    stories.forEach(function (st, si) {
      [-st.wall, st.wall].forEach(function (cx) {
        [-st.wall, st.wall].forEach(function (cz) {
          for (var h = 0; h < st.wallH; h += 0.8) pushV(vDark, bx + cx, y + h + 0.4, bz + cz, COL.darkWood, 1);
        });
      });
      for (var h = 0; h < st.wallH; h += 0.8) {
        var wh = st.wall - 0.7;
        for (var x = -wh; x <= wh; x++) {
          pushV(vWall, bx + x, y + h + 0.4, bz - wh, pick(COL.wall));
          pushV(vWall, bx + x, y + h + 0.4, bz + wh, pick(COL.wall));
        }
        for (var z = -wh + 1; z <= wh - 1; z++) {
          pushV(vWall, bx - wh, y + h + 0.4, bz + z, pick(COL.wall));
          if (!(si === 0 && Math.abs(z) < 1.2 && h < 2.0)) pushV(vWall, bx + wh, y + h + 0.4, bz + z, pick(COL.wall));
        }
      }
      if (si > 0) {
        var rh = st.wall + 0.4;
        for (var rx = -rh; rx <= rh; rx++) for (var rz = -rh; rz <= rh; rz++) {
          if (Math.abs(rx) === rh || Math.abs(rz) === rh)
            if ((rx + rz) % 2 === 0) pushV(vDark, bx + rx, y + 0.25, bz + rz, COL.darkWood, 0.7);
        }
      }
      var ry0 = y + st.wallH;
      for (var layer = 0; layer < 6; layer++) {
        var r = Math.round(st.roof - layer * (st.roof - st.wall - 0.4) / 5.5);
        var ly = ry0 + layer * 0.34;
        for (var x = -r; x <= r; x++) for (var z = -r; z <= r; z++) {
          var perim = (Math.abs(x) === r || Math.abs(z) === r);
          if (!perim) continue;
          var corner = (Math.abs(x) === r && Math.abs(z) === r) || (Math.abs(x) >= r - 1 && Math.abs(z) === r) || (Math.abs(z) >= r - 1 && Math.abs(x) === r);
          var lift = corner ? 0.34 : 0;
          pushV(vRoof, bx + x, ly + lift, bz + z, COL.roof, 0.99);
        }
      }
      y = ry0 + 6 * 0.34 + 0.1;
    });
    for (var h2 = 0; h2 < 3.4; h2 += 0.5) pushV(vDark, bx, y + 0.4 + h2, bz, COL.darkWood, 0.6);
    [0.8, 1.5, 2.2].forEach(function (hy) {
      for (var x = -1; x <= 1; x++) for (var z = -1; z <= 1; z++) {
        if ((Math.abs(x) === 1) !== (Math.abs(z) === 1)) continue;
        pushV(vStone, bx + x, y + hy, bz + z, sorinGold, 0.7);
      }
    });
    pushV(vStone, bx, y + 3.9, bz, sorinGold, 0.9);
    var door = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 2.1, 0.5),
      new THREE.MeshStandardMaterial({ color: 0xb03425, roughness: 0.55, metalness: 0.15, emissive: 0x000000 })
    );
    door.position.set(4.28, 2.6, 0);
    door.castShadow = true;
    door.name = 'door';
    scene.add(door);
    for (var fy = 1.7; fy <= 3.8; fy += 0.75) { pushV(vDark, 4.5, fy, -1.05, COL.darkWood, 0.8); pushV(vDark, 4.5, fy, 1.05, COL.darkWood, 0.8); }
  }
  buildPagoda();

  // ---- Torii ----
  function buildTorii() {
    var tx = 18, tz = 0;
    [-2.6, 2.6].forEach(function (off) {
      for (var h = 0; h < 6.4; h += 0.8) pushV(vTorii, tx, 0.5 + h, tz + off, jitterColor(COL.red, 0.05), 1);
    });
    for (var z = -3.2; z <= 3.2; z++) pushV(vTorii, tx, 4.6, tz + z, jitterColor(COL.red, 0.05));
    for (var z2 = -3.8; z2 <= 3.8; z2++) {
      var lift = Math.abs(z2) >= 3.5 ? 0.3 : 0;
      pushV(vTorii, tx, 6.6 + lift, tz + z2, jitterColor(COL.red, 0.04), 1.05);
      if (Math.abs(z2) < 3.6) pushV(vTorii, tx, 6.1, tz + z2, jitterColor(COL.red, 0.05), 0.9);
    }
    pushV(vTorii, tx, 5.45, tz, COL.red, 0.8); pushV(vTorii, tx, 5.1, tz, COL.red, 0.8);
  }
  buildTorii();

  // ---- Bridge ----
  function buildBridge() {
    for (var x = 4; x <= 14; x += 0.9) {
      var t = (x - 9) / 5;
      var arch = 0.55 + (1 - t * t) * 0.85;
      for (var z = -1.1; z <= 1.1; z += 0.55) pushV(vBridge, x, arch, z, jitterColor(COL.bridge, 0.05), 0.8);
      pushV(vBridge, x, arch + 0.55, -1.25, COL.bridge, 0.5);
      pushV(vBridge, x, arch + 0.55, 1.25, COL.bridge, 0.5);
    }
  }
  buildBridge();

  // ---- Big sakura trees ----
  var treeSpots = [[-10, 8], [-11, -7], [3, 14], [-4, -14], [16, 11], [18, -10], [14, -15], [23, 6], [-16, 0], [6, 19]];
  function blob(cx, cy, cz, r, n) {
    for (var x = -r; x <= r; x++) for (var y = -r; y <= r; y++) for (var z = -r; z <= r; z++) {
      if (x * x + y * y + z * z > r * r) continue;
      if (Math.random() < 0.38) continue;
      if (n++ > 55) break;
      pushV(vSakura, cx + x, cy + y, cz + z, COL.sakura, 0.95);
    }
    return n;
  }
  treeSpots.forEach(function (sp) {
    var bx = sp[0], bz = sp[1];
    var h = 5 + ((Math.random() * 3) | 0);
    for (var y = 0.6; y <= h; y += 0.8) pushV(vTrunk, bx, y, bz, COL.trunk, 1);
    var b = 2 + ((Math.random() * 2) | 0);
    for (var i = 0; i <= b; i++) {
      var ang = Math.random() * Math.PI * 2, len = 1.8 + Math.random() * 1.6;
      var ex = Math.round(Math.cos(ang) * len), ez = Math.round(Math.sin(ang) * len);
      for (var s = 1; s <= 2; s++)
        pushV(vTrunk, bx + Math.round(ex * s / 2), h - 0.6 + Math.round(s * 0.5), bz + Math.round(ez * s / 2), COL.trunk, 0.8);
      blob(bx + ex, h + 1.4 + ((Math.random() * 2) | 0), bz + ez, 3, 0);
    }
    blob(bx, h + 2.2, bz, 3, 0);
  });

  // Bushes + moss rocks
  [[6, -8], [12, 7], [-5, 3], [19, -3], [2, -6], [-14, 12], [22, -14]].forEach(function (sp) {
    for (var x = -1; x <= 1; x++) for (var y = 0; y <= 1; y++) for (var z = -1; z <= 1; z++) {
      if (x * x + y * y * 2 + z * z > 3) continue;
      pushV(vGrass, sp[0] + x, 0.5 + y * 0.55, sp[1] + z, jitterColor(0x3f6b2e, 0.08), 0.9);
    }
  });
  [[-7, -4], [14, 13], [-2, 16]].forEach(function (sp) {
    for (var x = -1; x <= 1; x++) for (var y = 0; y <= 1; y++) for (var z = -1; z <= 1; z++) {
      if (x*x + y*y + z*z > 2) continue;
      pushV(vStone, sp[0] + x, 0.4 + y * 0.5, sp[1] + z, jitterColor(0x7a7a72, 0.08), 0.9);
    }
  });

  // Stone lanterns (lit at night) + hanging pagoda lanterns
  [[14.5, 2.8], [14.5, -2.8], [19.5, 2.8], [-6, 10]].forEach(function (sp) {
    for (var y = 0.5; y <= 2.0; y += 0.75) pushV(vStone, sp[0], y, sp[1], COL.stone, 0.85);
    pushV(vStone, sp[0], 2.7, sp[1], COL.stone, 1.0);
    pushV(vStone, sp[0], 3.15, sp[1], COL.stone, 0.7);
    vLantern.push({ x: sp[0], y: 2.7, z: sp[1], c: COL.lantern, s: 0.62, ry: 0, light: true });
  });
  [[-5.6, -5.6], [-5.6, 5.6], [5.6, -5.6], [5.6, 5.6]].forEach(function (sp) {
    vLantern.push({ x: sp[0], y: 5.1, z: sp[1], c: COL.lantern, s: 0.7, ry: 0, light: true });
    pushV(vDark, sp[0], 5.9, sp[1], COL.darkWood, 0.5);
  });

  // ---- Pond: Reflector + rippling translucent overlay ----
  var reflector = new THREE.Reflector(new THREE.CircleGeometry(POND.r + 0.05, 48), {
    clipBias: 0.003, textureWidth: 1024, textureHeight: 1024, color: 0x3a6f8a
  });
  reflector.rotation.x = -Math.PI / 2;
  reflector.position.set(POND.cx, POND.waterY - 0.06, POND.cz);
  scene.add(reflector);

  var waterGeo = new THREE.PlaneGeometry(POND.r * 2.15, POND.r * 2.15, 40, 40);
  var waterMat = new THREE.MeshPhongMaterial({
    color: COL.water, transparent: true, opacity: 0.5, shininess: 120, specular: 0x88bbdd, side: THREE.DoubleSide
  });
  var water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(POND.cx, POND.waterY, POND.cz);
  water.name = 'water';
  scene.add(water);

  for (var a = 0; a < Math.PI * 2; a += 0.22) {
    var rr = POND.r + 0.55 + Math.random() * 0.4;
    pushV(vStone, POND.cx + Math.cos(a) * rr, 0.3, POND.cz + Math.sin(a) * rr, COL.stone, 0.7);
  }

  // ---- Koi (animated, seen through the water) ----
  var koiMats = [
    new THREE.MeshStandardMaterial({ color: 0xf07030, roughness: 0.5, emissive: 0x3a1200 }),
    new THREE.MeshStandardMaterial({ color: 0xe8e8e0, roughness: 0.5, emissive: 0x1a1a10 }),
    new THREE.MeshStandardMaterial({ color: 0xd8a030, roughness: 0.5, emissive: 0x2a2000 })
  ];
  var koi = [];
  function buildKoi(mat, orbit, speed, phase) {
    var g = new THREE.Group();
    var seg = [[0, 0, 0.62], [-0.55, 0.1, 0.5], [-1.05, 0.22, 0.38], [-1.5, 0.4, 0.28]];
    seg.forEach(function (s) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(s[2], Math.max(0.12, 0.3 - s[2] * 0.3), 0.26), mat);
      m.position.set(s[0], 0, s[1]);
      g.add(m);
    });
    var tail = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 0.3), mat);
    tail.position.set(-1.8, 0.05, 0.55); tail.rotation.y = 0.7;
    g.add(tail);
    g.userData = { orbit: orbit, speed: speed, phase: phase };
    scene.add(g);
    koi.push(g);
  }
  buildKoi(koiMats[0], 3.6, 0.22, 0);
  buildKoi(koiMats[1], 4.4, -0.16, 2.1);
  buildKoi(koiMats[2], 2.8, 0.28, 4.4);

  // ---- Stars + moon ----
  var starGeo = new THREE.BufferGeometry();
  var starPos = [];
  for (var i = 0; i < 600; i++) {
    var th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI * 0.42, R = 95 + Math.random() * 40;
    starPos.push(Math.cos(th) * Math.sin(ph + 0.15) * R, Math.abs(Math.cos(ph)) * R * 0.9 + 6, Math.sin(th) * Math.sin(ph + 0.15) * R);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({ color: 0xdfe8ff, size: 0.55, transparent: true, opacity: 0 });
  scene.add(new THREE.Points(starGeo, starMat));

  var moon = new THREE.Mesh(
    new THREE.SphereGeometry(2.4, 24, 24),
    new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0xe8eeff, emissiveIntensity: 0, transparent: true, opacity: 0 })
  );
  moon.position.set(-52, 38, -60);
  scene.add(moon);

  // ---- Fireflies (night only) ----
  var flyBase = [];
  for (var fi = 0; fi < 110; fi++) {
    flyBase.push([
      -22 + Math.random() * 46, 1.2 + Math.random() * 5, -19 + Math.random() * 40,
      Math.random() * Math.PI * 2, 0.3 + Math.random() * 0.8
    ]);
  }
  var flyGeo = new THREE.BufferGeometry();
  var flyArr = [];
  flyBase.forEach(function (v) { flyArr.push(v[0], v[1], v[2]); });
  flyGeo.setAttribute('position', new THREE.Float32BufferAttribute(flyArr, 3));
  var flyMat = new THREE.PointsMaterial({ color: 0xffe08a, size: 0.42, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
  var flies = new THREE.Points(flyGeo, flyMat);
  scene.add(flies);

  /* ---- Bake voxel buckets ---- */
  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  function bake(bucket, mat, cast, receive) {
    var mesh = new THREE.InstancedMesh(boxGeo, mat, bucket.length);
    var m = new THREE.Matrix4(), col = new THREE.Color();
    bucket.forEach(function (v, idx) {
      m.makeRotationY(v.ry || 0);
      m.setPosition(v.x, v.y, v.z);
      m.scale(new THREE.Vector3(v.s, v.s, v.s));
      mesh.setMatrixAt(idx, m);
      mesh.setColorAt(idx, col.setHex(v.c));
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = !!cast; mesh.receiveShadow = !!receive;
    scene.add(mesh);
    return mesh;
  }
  var matStd = function () { return new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.05 }); };
  bake(vGrass, matStd(), false, true);
  bake(vStone, matStd(), true, true);
  bake(vDark, matStd(), true, true);
  bake(vWall, matStd(), true, true);
  bake(vRoof, matStd(), true, true);
  bake(vSakura, new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0.05, emissive: 0x2a0a18, emissiveIntensity: 0 }), true, true);
  bake(vTrunk, matStd(), true, true);
  bake(vBridge, matStd(), true, true);
  bake(vFence, matStd(), true, true);
  var toriiMesh = bake(vTorii, new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.15, emissive: 0x000000 }), true, true);
  var lanternMat = new THREE.MeshPhongMaterial({ color: 0x8a5a20, emissive: 0xffb85c, emissiveIntensity: 0, shininess: 30 });
  var lanternMesh = bake(vLantern, lanternMat, false, true);
  var lanternLights = [];
  vLantern.forEach(function (v) {
    if (!v.light) return;
    var pl = new THREE.PointLight(0xffb35c, 0, 18, 2);
    pl.position.set(v.x, v.y + 0.2, v.z);
    scene.add(pl);
    lanternLights.push(pl);
  });

  /* ---- Petals ---- */
  var PETAL_N = 900;
  var petalGeo = new THREE.BoxGeometry(0.22, 0.05, 0.14);
  var petalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, emissive: 0x4a1830, emissiveIntensity: 0 });
  var petals = new THREE.InstancedMesh(petalGeo, petalMat, PETAL_N);
  scene.add(petals);
  var petalState = [];
  var petalCols = [0xfbb6da, 0xf887c0, 0xffffff, 0xe866ab];
  (function () {
    var col = new THREE.Color();
    for (var i = 0; i < PETAL_N; i++) {
      petalState.push(newPetal(true));
      petals.setColorAt(i, col.setHex(pick(petalCols)));
    }
    petals.instanceColor.needsUpdate = true;
  })();
  function newPetal(anywhere) {
    return {
      x: -26 + Math.random() * 54, z: -23 + Math.random() * 48,
      y: anywhere ? Math.random() * 22 : 20 + Math.random() * 6,
      vy: -(0.35 + Math.random() * 0.55),
      ph: Math.random() * Math.PI * 2, sway: 0.3 + Math.random() * 0.7,
      spin: Math.random() * Math.PI * 2, spinV: (Math.random() - 0.5) * 3
    };
  }

  /* ============================================================
     PHASE 3 — INTERACTION
     ============================================================ */
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(3, 5, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 10;
  controls.maxDistance = 80;
  controls.maxPolarAngle = 1.47;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  var idleTimer = null;
  function touchIdle() {
    controls.autoRotate = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { controls.autoRotate = true; }, 6000);
  }
  renderer.domElement.addEventListener('pointerdown', touchIdle);
  renderer.domElement.addEventListener('wheel', touchIdle);

  var nightTarget = 0, night = 0;
  var todSlider = document.getElementById('todSlider');
  var todVal = document.getElementById('todVal');
  todSlider.addEventListener('input', function () {
    nightTarget = this.value / 100;
    todVal.textContent = nightTarget > 0.66 ? 'Night' : (nightTarget > 0.33 ? 'Dusk' : 'Day');
  });

  var gustBtn = document.getElementById('gustBtn');
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
  }
  var wind = 0.35, gustEnergy = 0;
  gustBtn.addEventListener('click', function () {
    gustEnergy = 4.2;
    gustBtn.classList.add('blowing');
    showToast('A gust sweeps through the garden');
    setTimeout(function () { gustBtn.classList.remove('blowing'); }, 3200);
  });

  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var toriiFlash = 0, doorFlash = 0, lanternPulse = 0;
  var doorObj = scene.getObjectByName('door');
  var clickables = [toriiMesh, lanternMesh, water, doorObj];

  var downPos = null;
  renderer.domElement.addEventListener('pointerdown', function (e) { downPos = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    if (Math.abs(e.clientX - downPos[0]) > 5 || Math.abs(e.clientY - downPos[1]) > 5) { downPos = null; return; }
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(clickables, false);
    if (!hits.length) return;
    var obj = hits[0].object;
    if (obj === toriiMesh) { toriiFlash = 1; showToast('The torii gate glows softly'); }
    else if (obj === lanternMesh) { lanternPulse = 1; showToast('The lanterns flicker to life'); }
    else if (obj === doorObj) { doorFlash = 1; lanternPulse = 1; showToast('The pagoda door hums with quiet energy'); }
    else if (obj === water) addRipple(hits[0].point.x - POND.cx, hits[0].point.z - POND.cz);
  });

  var ripples = [{ x: 0, z: 0, t: 0, amp: 0.09 }, { x: -2.5, z: 1.8, t: 3.1, amp: 0.07 }, { x: 2.2, z: -2.0, t: 6.4, amp: 0.07 }];
  function addRipple(x, z) {
    ripples.push({ x: x, z: z, t: 0, amp: 0.16 });
    if (ripples.length > 8) ripples.shift();
  }
  var waterBase = waterGeo.attributes.position.array.slice();
  function updateWater(time) {
    var pos = waterGeo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var ox = waterBase[i * 3], oy = waterBase[i * 3 + 1];
      var disp = Math.sin(ox * 0.9 + time * 0.8) * 0.018 + Math.cos(oy * 1.1 + time * 0.6) * 0.018;
      for (var r = 0; r < ripples.length; r++) {
        var rp = ripples[r];
        var dx = ox - rp.x, dy = oy - rp.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d > 4.2) continue;
        var wave = Math.sin(d * 5.2 - rp.t * 3.4) * Math.exp(-d * 0.55) * Math.exp(-rp.t * 0.45);
        disp += wave * rp.amp * 4;
      }
      pos.setZ(i, disp);
    }
    pos.needsUpdate = true;
    waterGeo.computeVertexNormals();
  }

  var sunDayC = new THREE.Color(0xffe8c4), sunNightC = new THREE.Color(0x8fa3e8);
  var hemiSkyDay = new THREE.Color(0xbfd9ea), hemiSkyNight = new THREE.Color(0x26324f);
  var hemiGndDay = new THREE.Color(0x5a7a44), hemiGndNight = new THREE.Color(0x151a24);
  var skyDay = COL.skyDay.clone(), skyNight = COL.skyNight.clone();

  /* ============================================================
     PHASE 4 — ANIMATION LOOP
     ============================================================ */
  var clock = new THREE.Clock();
  var pm = new THREE.Matrix4(), pq = new THREE.Quaternion(), pe = new THREE.Euler(), pv = new THREE.Vector3(1, 1, 1);
  var pv1 = new THREE.Vector3();
  var fpsEl = document.getElementById('fps'), fpsFrames = 0, fpsTimer = 0;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var time = clock.elapsedTime;

    night += (nightTarget - night) * Math.min(1, dt * 2.2);
    var n2 = night * night;
    scene.background.lerpColors(skyDay, skyNight, n2);
    scene.fog.color.copy(scene.background);
    sun.intensity = 1.3 * (1 - n2) + 0.22 * n2;
    sun.color.lerpColors(sunDayC, sunNightC, n2);
    sun.position.y = 36 - 18 * n2;
    hemi.intensity = 0.55 * (1 - n2) + 0.20 * n2;
    hemi.color.lerpColors(hemiSkyDay, hemiSkyNight, n2);
    hemi.groundColor.lerpColors(hemiGndDay, hemiGndNight, n2);
    starMat.opacity = Math.max(0, n2 - 0.25) * 1.1;
    moon.material.emissiveIntensity = n2 * 2.6;
    moon.material.opacity = Math.max(0, n2 - 0.1);
    flyMat.opacity = Math.max(0, n2 - 0.3) * 0.95;
    bloomPass.strength = 0.42 + n2 * 0.45;

    lanternPulse = Math.max(0, lanternPulse - dt * 0.7);
    var pulseWave = lanternPulse > 0 ? Math.sin(lanternPulse * 18) * 0.5 + 0.5 : 0;
    lanternMat.emissiveIntensity = Math.min(2.6, n2 * 1.3 + pulseWave * 0.9);
    var li = n2 * 2.6 + pulseWave * 1.8;
    lanternLights.forEach(function (pl) { pl.intensity = li; });

    if (toriiFlash > 0) toriiFlash = Math.max(0, toriiFlash - dt * 0.9);
    toriiMesh.material.emissive.setRGB(toriiFlash * 0.9, toriiFlash * 0.25, toriiFlash * 0.18);
    if (doorFlash > 0) {
      doorFlash = Math.max(0, doorFlash - dt * 0.9);
      doorObj.material.emissive.setRGB(doorFlash * 0.9, doorFlash * 0.22, doorFlash * 0.13);
    }
    petalMat.emissiveIntensity = n2 * 0.5;

    ripples.forEach(function (rp) { rp.t += dt; });
    updateWater(time);

    koi.forEach(function (k) {
      var u = k.userData;
      var a2 = u.phase + time * u.speed;
      k.position.set(POND.cx + Math.cos(a2) * u.orbit, 0.16 + Math.sin(time * 2 + u.phase) * 0.03, POND.cz + Math.sin(a2) * u.orbit);
      k.rotation.y = -a2 + (u.speed > 0 ? Math.PI / 2 : -Math.PI / 2) + Math.sin(time * 5 + u.phase) * 0.15;
    });

    var flyPos = flyGeo.attributes.position;
    for (var fi2 = 0; fi2 < flyBase.length; fi2++) {
      var fb = flyBase[fi2];
      flyPos.setXYZ(fi2,
        fb[0] + Math.sin(time * fb[4] + fb[3]) * 0.8,
        fb[1] + Math.sin(time * fb[4] * 0.7 + fb[3] * 2) * 0.5,
        fb[2] + Math.cos(time * fb[4] * 0.8 + fb[3]) * 0.8);
    }
    flyPos.needsUpdate = true;

    gustEnergy = Math.max(0, gustEnergy - dt * 1.1);
    wind = 0.35 + gustEnergy;
    var windX = wind * Math.sin(time * 0.7 + 1.3) * 0.6 + wind * 0.9;
    var windZ = wind * Math.sin(time * 0.5) * 0.5;
    for (var i2 = 0; i2 < PETAL_N; i2++) {
      var p = petalState[i2];
      p.ph += dt;
      p.spin += p.spinV * dt * (1 + wind * 0.3);
      p.y += p.vy * dt * (1 + wind * 0.35);
      p.x += (windX * 0.4 + Math.sin(p.ph * 1.7) * p.sway * 0.4) * dt;
      p.z += (windZ * 0.4 + Math.cos(p.ph * 1.3) * p.sway * 0.4) * dt;
      if (p.y <= 0.55) petalState[i2] = newPetal(false);
      pe.set(p.spin * 0.7, p.spin, Math.sin(p.ph) * 0.8);
      pq.setFromEuler(pe);
      pv.set(1 + Math.sin(p.ph) * 0.25, 1, 1);
      pv1.set(p.x, p.y, p.z);
      pm.compose(pv1, pq, pv);
      petals.setMatrixAt(i2, pm);
    }
    petals.instanceMatrix.needsUpdate = true;

    controls.update();
    composer.render();

    fpsFrames++; fpsTimer += dt;
    if (fpsTimer >= 1) {
      fpsEl.textContent = Math.round(fpsFrames / fpsTimer) + ' fps';
      fpsFrames = 0; fpsTimer = 0;
    }
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>
</body>
</html>
